<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samorost Style Quest Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .quest-counter {
            background: rgba(20, 24, 16, 0.75);
            border: 1px solid rgba(140, 160, 100, 0.4);
            color: #d4e0b0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #audio-btn {
            pointer-events: auto;
            background: rgba(20, 24, 16, 0.75);
            border: 1px solid rgba(140, 160, 100, 0.4);
            color: #d4e0b0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        #audio-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PixiJS v8 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="ui-overlay">
        <div class="quest-counter">НАЙДЕНО: <span id="progress-val">0</span> / 7</div>
        <div id="audio-btn">
            <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </div>
    </div>
</div>

<script>
// ============================================================================
// 1. TELEGRAM MINI APP INITIALIZATION
// ============================================================================
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#0d0e0a');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#0d0e0a');
}

// ============================================================================
// 2. AUDIO SYNTHESIZER (WEB AUDIO API)
// ============================================================================
class SoundController {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.isBgPlaying = false;
        this.bgTimer = null;
    }

    init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
    }

    playFootstep() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120 + Math.random() * 30, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
    }

    playCoinSound() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        
        const playTone = (freq, start, duration) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0.2, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(start);
            osc.stop(start + duration);
        };

        playTone(987.77, now, 0.12);        // B5
        playTone(1318.51, now + 0.08, 0.35); // E6
    }

    startAmbientMusic() {
        if (this.isBgPlaying || !this.ctx) return;
        this.isBgPlaying = true;
        
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C major pentatonic
        
        const playAmbientNote = () => {
            if (this.muted || !this.isBgPlaying) return;
            const freq = scale[Math.floor(Math.random() * scale.length)];
            const now = this.ctx.currentTime;
            
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq / 2, now); // Soft bass/mid tone

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 1.2);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 4.1);

            const nextTime = 2000 + Math.random() * 3500;
            this.bgTimer = setTimeout(playAmbientNote, nextTime);
        };

        playAmbientNote();
    }

    toggleMute() {
        this.muted = !this.muted;
        return this.muted;
    }
}

const audioCtrl = new SoundController();

// UI Audio button handler
const audioBtn = document.getElementById('audio-btn');
const soundOnIcon = document.getElementById('icon-sound-on');
const soundOffIcon = document.getElementById('icon-sound-off');

audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audioCtrl.init();
    if (audioCtrl.ctx && audioCtrl.ctx.state === 'suspended') {
        audioCtrl.ctx.resume();
    }
    audioCtrl.startAmbientMusic();
    const isMuted = audioCtrl.toggleMute();
    soundOnIcon.style.display = isMuted ? 'none' : 'block';
    soundOffIcon.style.display = isMuted ? 'block' : 'none';
});

// ============================================================================
// 3. NAVIGATION GRAPH & OBJECT POSITIONS (Normalized Coordinates 0.0 - 1.0)
// ============================================================================
const NAV_NODES = {
    'lantern': { x: 0.22, y: 0.74, depth: 1.15 },
    'bridge_bottom': { x: 0.38, y: 0.77, depth: 1.1 },
    'chest': { x: 0.35, y: 0.82, depth: 1.2 },
    'door_front': { x: 0.32, y: 0.52, depth: 0.95 },
    'sphere_front': { x: 0.25, y: 0.25, depth: 0.8 },
    'owl_front': { x: 0.30, y: 0.16, depth: 0.75 },
    'pipe_mid': { x: 0.76, y: 0.48, depth: 0.9 },
    'basket_front': { x: 0.63, y: 0.86, depth: 1.25 }
};

const NAV_EDGES = [
    ['lantern', 'bridge_bottom'],
    ['bridge_bottom', 'chest'],
    ['bridge_bottom', 'door_front'],
    ['door_front', 'sphere_front'],
    ['sphere_front', 'owl_front'],
    ['bridge_bottom', 'pipe_mid'],
    ['pipe_mid', 'basket_front']
];

const INTERACTIVE_OBJECTS = [
    { id: 'lantern', name: 'Фонарь', node: 'lantern', hit: { x: 0.21, y: 0.71, r: 0.06 } },
    { id: 'chest', name: 'Сундук', node: 'chest', hit: { x: 0.35, y: 0.82, r: 0.07 } },
    { id: 'door', name: 'Дверь', node: 'door_front', hit: { x: 0.32, y: 0.46, r: 0.08 } },
    { id: 'sphere', name: 'Шар', node: 'sphere_front', hit: { x: 0.25, y: 0.12, r: 0.06 } },
    { id: 'owl', name: 'Совенок', node: 'owl_front', hit: { x: 0.30, y: 0.13, r: 0.06 } },
    { id: 'pipe', name: 'Труба', node: 'pipe_mid', hit: { x: 0.80, y: 0.38, r: 0.08 } },
    { id: 'basket', name: 'Алтарь', node: 'basket_front', hit: { x: 0.63, y: 0.86, r: 0.08 } }
];

// Dijkstra Pathfinding
function findShortestPath(startNodeKey, targetNodeKey) {
    const distances = {};
    const previous = {};
    const nodes = Object.keys(NAV_NODES);

    nodes.forEach(node => {
        distances[node] = Infinity;
        previous[node] = null;
    });
    distances[startNodeKey] = 0;

    const unvisited = new Set(nodes);

    while (unvisited.size > 0) {
        let current = null;
        let lowestDist = Infinity;
        unvisited.forEach(node => {
            if (distances[node] < lowestDist) {
                lowestDist = distances[node];
                current = node;
            }
        });

        if (current === null || current === targetNodeKey) break;
        unvisited.delete(current);

        // Find neighbors
        NAV_EDGES.forEach(([u, v]) => {
            let neighbor = null;
            if (u === current) neighbor = v;
            if (v === current) neighbor = u;

            if (neighbor && unvisited.has(neighbor)) {
                const p1 = NAV_NODES[current];
                const p2 = NAV_NODES[neighbor];
                const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                const alt = distances[current] + dist;

                if (alt < distances[neighbor]) {
                    distances[neighbor] = alt;
                    previous[neighbor] = current;
                }
            }
        });
    }

    const path = [];
    let curr = targetNodeKey;
    while (curr) {
        path.unshift(curr);
        curr = previous[curr];
    }
    return path[0] === startNodeKey ? path : [startNodeKey];
}

// ============================================================================
// 4. MAIN GAME LOGIC & PIXIJS RENDERING
// ============================================================================
let app;
let worldContainer;
let bgSprite;
let heroContainer;
let heroRig = {};
let objectSprites = {};

let gameWidth = 0;
let gameHeight = 0;
let sceneScale = 1;

let currentNodeKey = 'bridge_bottom';
let isMoving = false;
let movePath = [];
let currentPathIndex = 0;
let targetObject = null;

let completedObjects = new Set();
let gameTime = 0;

// Character procedural animation state
let heroAnim = {
    walkCycle: 0,
    facingRight: true,
    emotionState: 'IDLE', // IDLE, WALKING, HAPPY
    emotionTimer: 0
};

async function initGame() {
    app = new PIXI.Application();
    
    await app.init({
        resizeTo: document.getElementById('game-container'),
        backgroundColor: 0x0d0e0a,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
        preference: 'webgl'
    });

    document.getElementById('game-container').appendChild(app.canvas);

    worldContainer = new PIXI.Container();
    app.stage.addChild(worldContainer);

    setupBackground();
    setupInteractiveObjects();
    setupHeroRig();

    app.stage.eventMode = 'static';
    app.stage.hitArea = app.screen;
    app.stage.on('pointerdown', onStageClick);

    app.ticker.add((ticker) => updateGame(ticker.deltaTime));

    window.addEventListener('resize', onResize);
    onResize();
}

// Draw Background Image via HTML5 Canvas Graphic Engine Fallback (Procedural Samorost Visuals)
function setupBackground() {
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = 1000;
    bgCanvas.height = 1500;
    const ctx = bgCanvas.getContext('2d');

    // Deep forest tree background
    const grad = ctx.createLinearGradient(0, 0, 0, 1500);
    grad.addColorStop(0, '#12180f');
    grad.addColorStop(0.5, '#222b18');
    grad.addColorStop(1, '#0e120a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1000, 1500);

    // Tree Trunk Structure
    ctx.fillStyle = '#2a1f14';
    ctx.beginPath();
    ctx.moveTo(100, 0);
    ctx.bezierCurveTo(250, 400, 50, 1000, 200, 1500);
    ctx.lineTo(900, 1500);
    ctx.bezierCurveTo(950, 900, 800, 400, 850, 0);
    ctx.fill();

    // Moss details & branches
    ctx.fillStyle = '#3a4a24';
    ctx.beginPath();
    ctx.arc(320, 780, 180, 0, Math.PI * 2);
    ctx.arc(700, 500, 140, 0, Math.PI * 2);
    ctx.fill();

    // Bridge
    ctx.strokeStyle = '#5a432d';
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.moveTo(220, 1110);
    ctx.lineTo(380, 1155);
    ctx.lineTo(760, 720);
    ctx.stroke();

    const texture = PIXI.Texture.from(bgCanvas);
    bgSprite = new PIXI.Sprite(texture);
    worldContainer.addChild(bgSprite);
}

// Procedural Interactive Objects Rendering
function setupInteractiveObjects() {
    INTERACTIVE_OBJECTS.forEach(obj => {
        const objContainer = new PIXI.Container();
        
        const graphic = new PIXI.Graphics();
        graphic.circle(0, 0, 25);
        graphic.fill({ color: 0xd4e0b0, alpha: 0.2 });
        graphic.stroke({ color: 0xd4e0b0, width: 2, alpha: 0.6 });

        const core = new PIXI.Graphics();
        core.circle(0, 0, 10);
        core.fill({ color: 0xffea79, alpha: 0.8 });

        objContainer.addChild(graphic);
        objContainer.addChild(core);

        objContainer.x = obj.hit.x * 1000;
        objContainer.y = obj.hit.y * 1500;

        worldContainer.addChild(objContainer);
        objectSprites[obj.id] = { container: objContainer, core: core, pulse: Math.random() * 10 };
    });
}

// Assemble Procedural 2.5D Rig Hero (Matching visual description)
function setupHeroRig() {
    heroContainer = new PIXI.Container();

    // Shadow
    const shadow = new PIXI.Graphics();
    shadow.ellipse(0, 0, 18, 6);
    shadow.fill({ color: 0x000000, alpha: 0.4 });
    heroContainer.addChild(shadow);

    const bodyGroup = new PIXI.Container();
    heroContainer.addChild(bodyGroup);

    // Legs
    const leftLeg = new PIXI.Graphics().rect(-3, 0, 6, 24).fill(0x3a2e2b);
    leftLeg.position.set(-6, -24);
    const rightLeg = new PIXI.Graphics().rect(-3, 0, 6, 24).fill(0x3a2e2b);
    rightLeg.position.set(6, -24);
    bodyGroup.addChild(leftLeg);
    bodyGroup.addChild(rightLeg);

    // Torso / Clothes
    const torso = new PIXI.Graphics();
    torso.moveTo(-12, -24);
    torso.lineTo(12, -24);
    torso.lineTo(15, -55);
    torso.lineTo(-15, -55);
    torso.closePath();
    torso.fill(0x736843);
    bodyGroup.addChild(torso);

    // Head Group
    const headGroup = new PIXI.Container();
    headGroup.position.set(0, -55);

    // Head base
    const head = new PIXI.Graphics();
    head.ellipse(0, -18, 22, 18);
    head.fill(0x8a9071);

    // Horns / Twigs
    const hornL = new PIXI.Graphics().stroke({ width: 3, color: 0x3a2e2b }).moveTo(-10, -32).lineTo(-18, -48);
    const hornR = new PIXI.Graphics().stroke({ width: 3, color: 0x3a2e2b }).moveTo(10, -32).lineTo(16, -52);

    // Big Eyes
    const eyeL = new PIXI.Graphics().circle(-8, -18, 6).fill(0xffffff).circle(-8, -18, 3).fill(0x221100);
    const eyeR = new PIXI.Graphics().circle(8, -18, 6).fill(0xffffff).circle(8, -18, 3).fill(0x221100);

    headGroup.addChild(head);
    headGroup.addChild(hornL);
    headGroup.addChild(hornR);
    headGroup.addChild(eyeL);
    headGroup.addChild(eyeR);

    bodyGroup.addChild(headGroup);

    // Store references for animation
    heroRig = {
        container: heroContainer,
        bodyGroup: bodyGroup,
        leftLeg: leftLeg,
        rightLeg: rightLeg,
        headGroup: headGroup,
        eyeL: eyeL,
        eyeR: eyeR
    };

    // Initial positioning
    const initPos = NAV_NODES[currentNodeKey];
    heroContainer.x = initPos.x * 1000;
    heroContainer.y = initPos.y * 1500;
    heroContainer.scale.set(initPos.depth);

    worldContainer.addChild(heroContainer);
}

// Handle Touch / Click Input
function onStageClick(e) {
    audioCtrl.init();
    if (audioCtrl.ctx && audioCtrl.ctx.state === 'suspended') {
        audioCtrl.ctx.resume();
    }
    audioCtrl.startAmbientMusic();

    const localPos = worldContainer.toLocal(e.global);
    const normX = localPos.x / 1000;
    const normY = localPos.y / 1500;

    // Check hit on interactive objects
    let clickedObj = null;
    for (const obj of INTERACTIVE_OBJECTS) {
        const dist = Math.hypot(normX - obj.hit.x, normY - obj.hit.y);
        if (dist <= obj.hit.r) {
            clickedObj = obj;
            break;
        }
    }

    if (clickedObj) {
        targetObject = clickedObj;
        const path = findShortestPath(currentNodeKey, clickedObj.node);
        if (path.length > 1) {
            movePath = path;
            currentPathIndex = 1;
            isMoving = true;
            heroAnim.emotionState = 'WALKING';
        } else {
            interactWithObject(clickedObj);
        }
    } else {
        // Find nearest nav node to click position
        let closestNode = null;
        let minDist = Infinity;
        Object.keys(NAV_NODES).forEach(key => {
            const node = NAV_NODES[key];
            const d = Math.hypot(normX - node.x, normY - node.y);
            if (d < minDist) {
                minDist = d;
                closestNode = key;
            }
        });

        if (closestNode && closestNode !== currentNodeKey) {
            targetObject = null;
            movePath = findShortestPath(currentNodeKey, closestNode);
            currentPathIndex = 1;
            isMoving = true;
            heroAnim.emotionState = 'WALKING';
        }
    }
}

// Object Interaction Logic
function interactWithObject(obj) {
    audioCtrl.playCoinSound();
    heroAnim.emotionState = 'HAPPY';
    heroAnim.emotionTimer = 1.2; // 1.2s joy duration

    if (!completedObjects.has(obj.id)) {
        completedObjects.add(obj.id);
        document.getElementById('progress-val').innerText = completedObjects.size;

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }

        // Animate clicked object pulse
        const spriteData = objectSprites[obj.id];
        if (spriteData) {
            spriteData.container.scale.set(1.6);
        }

        if (completedObjects.size === 7) {
            setTimeout(() => {
                alert('Поздравляем! Квест пройден!');
            }, 500);
        }
    }
}

// Main Frame Loop
function updateGame(delta) {
    gameTime += delta * 0.05;

    // Ambient Object Pulsing
    INTERACTIVE_OBJECTS.forEach(obj => {
        const spriteData = objectSprites[obj.id];
        if (spriteData) {
            spriteData.pulse += delta * 0.05;
            const scaleBase = completedObjects.has(obj.id) ? 0.8 : 1.0;
            const pulseScale = scaleBase + Math.sin(spriteData.pulse) * 0.1;
            spriteData.container.scale.x += (pulseScale - spriteData.container.scale.x) * 0.1;
            spriteData.container.scale.y += (pulseScale - spriteData.container.scale.y) * 0.1;
        }
    });

    // Movement Controller
    if (isMoving && movePath.length > 0) {
        const nextNodeKey = movePath[currentPathIndex];
        const targetNode = NAV_NODES[nextNodeKey];
        
        const targetX = targetNode.x * 1000;
        const targetY = targetNode.y * 1500;

        const dx = targetX - heroContainer.x;
        const dy = targetY - heroContainer.y;
        const dist = Math.hypot(dx, dy);

        const speed = 2.5 * delta;

        if (dist > speed) {
            heroContainer.x += (dx / dist) * speed;
            heroContainer.y += (dy / dist) * speed;

            // Facing direction
            if (Math.abs(dx) > 0.5) {
                heroAnim.facingRight = dx > 0;
                heroRig.bodyGroup.scale.x = heroAnim.facingRight ? 1 : -1;
            }

            // Depth Scale Interpolation
            const currentDepth = heroContainer.scale.x;
            const targetDepth = targetNode.depth;
            heroContainer.scale.set(currentDepth + (targetDepth - currentDepth) * 0.05);

            // Procedural Walk Cycle
            heroAnim.walkCycle += delta * 0.25;
            heroRig.leftLeg.rotation = Math.sin(heroAnim.walkCycle) * 0.5;
            heroRig.rightLeg.rotation = -Math.sin(heroAnim.walkCycle) * 0.5;
            heroRig.bodyGroup.y = -Math.abs(Math.sin(heroAnim.walkCycle)) * 4;

            // Step sound trigger
            if (Math.abs(Math.sin(heroAnim.walkCycle)) > 0.95) {
                audioCtrl.playFootstep();
            }
        } else {
            // Reached Waypoint
            heroContainer.x = targetX;
            heroContainer.y = targetY;
            currentNodeKey = nextNodeKey;
            currentPathIndex++;

            if (currentPathIndex >= movePath.length) {
                isMoving = false;
                heroAnim.emotionState = 'IDLE';
                heroRig.leftLeg.rotation = 0;
                heroRig.rightLeg.rotation = 0;
                heroRig.bodyGroup.y = 0;

                if (targetObject) {
                    interactWithObject(targetObject);
                    targetObject = null;
                }
            }
        }
    } else if (heroAnim.emotionState === 'HAPPY') {
        // Joy Emotion Animation Routine
        heroAnim.emotionTimer -= delta * 0.02;
        heroRig.bodyGroup.y = -Math.abs(Math.sin(gameTime * 3)) * 8;
        heroRig.headGroup.rotation = Math.sin(gameTime * 4) * 0.15;

        if (heroAnim.emotionTimer <= 0) {
            heroAnim.emotionState = 'IDLE';
            heroRig.bodyGroup.y = 0;
            heroRig.headGroup.rotation = 0;
        }
    } else {
        // Idle Breathing Animation
        heroRig.bodyGroup.y = Math.sin(gameTime) * 1.5;
        heroRig.headGroup.rotation = Math.sin(gameTime * 0.5) * 0.03;
    }
}

// Responsive Aspect Ratio Controller
function onResize() {
    if (!app || !bgSprite) return;

    const w = window.innerWidth;
    const h = window.innerHeight;

    // Scale to fit screen aspect ratio inside vertical canvas
    const scale = Math.min(w / 1000, h / 1500);
    worldContainer.scale.set(scale);

    worldContainer.x = (w - 1000 * scale) / 2;
    worldContainer.y = (h - 1500 * scale) / 2;
}

// Start Game App Engine
window.addEventListener('DOMContentLoaded', initGame);
</script>

</body>
</html>
