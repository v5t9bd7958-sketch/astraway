<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Квест-игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 22px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 8px 24px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #status.show { opacity: 1; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">🍎 Собрано: <span id="counter">0</span>/7</div>
    <div id="status">✨ Все собрано! ✨</div>
</div>

<script>
    // ----- Инициализация Telegram WebApp -----
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // ----- Получение элементов -----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const counterSpan = document.getElementById('counter');
    const statusDiv = document.getElementById('status');

    // ----- Размеры canvas -----
    let W, H;
    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        W = canvas.width;
        H = canvas.height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ----- Загрузка изображений -----
    const bgImg = new Image();
    bgImg.src = 'background.png';
    const heroImg = new Image();
    heroImg.src = 'hero.png';

    let imagesLoaded = 0;
    function onImageLoad() {
        imagesLoaded++;
        if (imagesLoaded === 2) initGame();
    }
    bgImg.onload = onImageLoad;
    heroImg.onload = onImageLoad;
    bgImg.onerror = () => { bgImg._fallback = true; onImageLoad(); };
    heroImg.onerror = () => { heroImg._fallback = true; onImageLoad(); };

    // ----- Игровые переменные -----
    const hero = {
        x: 0, y: 0,
        targetX: 0, targetY: 0,
        speed: 2.5,
        radius: 30,
        isMoving: false,
        isHappy: false,
        happyTimer: 0,
        scale: 1,
        stepCounter: 0,
    };

    let items = [];
    const ITEM_RADIUS = 20;
    let collected = 0;

    // ----- Звуки (Web Audio) -----
    let audioCtx = null;
    let bgOscillator = null;

    function initAudio() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Фоновая музыка – релакс
            bgOscillator = audioCtx.createOscillator();
            const bgGain = audioCtx.createGain();
            bgOscillator.type = 'sine';
            bgOscillator.frequency.value = 220;
            bgGain.gain.value = 0.15;
            bgOscillator.connect(bgGain);
            bgGain.connect(audioCtx.destination);
            bgOscillator.start(0);
            setInterval(() => {
                if (bgOscillator) {
                    bgOscillator.frequency.setTargetAtTime(200 + Math.random() * 40, audioCtx.currentTime, 1);
                }
            }, 3000);
        } catch(e) { console.warn('Audio init error'); }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'step') {
                osc.type = 'sine';
                osc.frequency.value = 600 + Math.random() * 200;
                gain.gain.value = 0.05;
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'coin') {
                osc.type = 'square';
                osc.frequency.value = 880;
                gain.gain.value = 0.1;
                osc.start(audioCtx.currentTime);
                osc.frequency.setTargetAtTime(1200, audioCtx.currentTime + 0.05, 0.02);
                gain.gain.setTargetAtTime(0, audioCtx.currentTime + 0.15, 0.02);
                osc.stop(audioCtx.currentTime + 0.2);
            }
        } catch(e) {}
    }

    // ----- Генерация 7 предметов на дереве -----
    function generateItems() {
        const baseX = W * 0.5;
        const baseY = H * 0.3;
        const angles = [0, 0.4, 0.9, 1.3, 1.8, 2.2, 2.7];
        const radius = Math.min(W, H) * 0.2;
        items = [];
        for (let i = 0; i < 7; i++) {
            const angle = angles[i % angles.length];
            const x = baseX + Math.cos(angle) * radius * (0.8 + 0.2 * (i % 3));
            const y = baseY + Math.sin(angle) * radius * (0.6 + 0.2 * (i % 2));
            items.push({
                x, y,
                radius: ITEM_RADIUS,
                collected: false,
                animating: false,
                animTime: 0,
                bounceY: 0,
            });
        }
    }

    function setHeroStart() {
        hero.x = W * 0.2;
        hero.y = H * 0.8;
        hero.targetX = hero.x;
        hero.targetY = hero.y;
    }

    // ----- Игровой цикл -----
    let gameRunning = false;

    function gameLoop() {
        if (!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        // Движение героя к цели
        const dx = hero.targetX - hero.x;
        const dy = hero.targetY - hero.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 1) {
            const step = Math.min(hero.speed, dist);
            hero.x += (dx / dist) * step;
            hero.y += (dy / dist) * step;
            hero.isMoving = true;
            hero.stepCounter += step;
            if (hero.stepCounter > 12) {
                hero.stepCounter = 0;
                playSound('step');
            }
        } else {
            hero.x = hero.targetX;
            hero.y = hero.targetY;
            if (hero.isMoving) {
                hero.isMoving = false;
                hero.stepCounter = 0;
            }
        }

        // Анимация радости героя
        if (hero.isHappy) {
            hero.happyTimer--;
            hero.scale = 1 + 0.15 * Math.sin(hero.happyTimer * 0.2);
            if (hero.happyTimer <= 0) {
                hero.isHappy = false;
                hero.scale = 1;
            }
        }

        // ----- ОБНОВЛЕНИЕ АНИМАЦИИ ПРЕДМЕТОВ (исправлено) -----
        for (let item of items) {
            if (item.animating) {
                item.animTime--;
                item.bounceY = -5 * Math.sin(item.animTime * 0.3);
                if (item.animTime <= 0) {
                    item.animating = false;
                    item.bounceY = 0;
                }
            }
        }

        // ----- ПРОВЕРКА СТОЛКНОВЕНИЙ (только для активных предметов) -----
        for (let item of items) {
            if (item.collected || item.animating) continue; // не собираем повторно
            const d = Math.hypot(hero.x - item.x, hero.y - item.y);
            if (d < hero.radius + item.radius) {
                item.collected = true;
                item.animating = true;
                item.animTime = 20;
                collected++;
                counterSpan.textContent = collected;
                playSound('coin');
                hero.isHappy = true;
                hero.happyTimer = 30;

                if (collected === 7) {
                    statusDiv.classList.add('show');
                    tg.sendData(JSON.stringify({ action: 'quest_complete', collected }));
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);

        // --- Фон ---
        if (bgImg.complete && !bgImg._fallback) {
            ctx.drawImage(bgImg, 0, 0, W, H);
        } else {
            const grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#4a7c59');
            grad.addColorStop(1, '#8fc1a9');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#5d3a1a';
            ctx.fillRect(W*0.45, H*0.2, W*0.1, H*0.5);
            ctx.fillStyle = '#2e7d32';
            ctx.beginPath();
            ctx.arc(W*0.5, H*0.2, W*0.2, 0, Math.PI*2);
            ctx.fill();
        }

        // --- Предметы ---
        for (let item of items) {
            if (item.collected && !item.animating) continue; // скрыть после анимации
            const drawY = item.y + (item.bounceY || 0);
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            const gradient = ctx.createRadialGradient(
                item.x-4, drawY-4, 2,
                item.x, drawY, item.radius
            );
            gradient.addColorStop(0, '#FFD700');
            gradient.addColorStop(0.8, '#FFA500');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(item.x, drawY, item.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(item.x-4, drawY-5, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(items.indexOf(item)+1, item.x, drawY);
        }

        // --- Герой ---
        ctx.save();
        ctx.translate(hero.x, hero.y);
        ctx.scale(hero.scale, hero.scale);
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 15;
        if (heroImg.complete && !heroImg._fallback) {
            const w = hero.radius * 2.5;
            const h = hero.radius * 2.5;
            ctx.drawImage(heroImg, -w/2, -h/2, w, h);
        } else {
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(0, 0, hero.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('😊', 0, 0);
        }
        ctx.restore();
        ctx.shadowBlur = 0;
    }

    // ----- Управление кликом / тапом -----
    function handleClick(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        const canvasX = (clientX - rect.left) * scaleX;
        const canvasY = (clientY - rect.top) * scaleY;
        const margin = hero.radius;
        hero.targetX = Math.min(Math.max(canvasX, margin), W - margin);
        hero.targetY = Math.min(Math.max(canvasY, margin), H - margin);
        if (!audioCtx) initAudio(); // аудио по первому касанию
    }

    canvas.addEventListener('click', handleClick);
    canvas.addEventListener('touchstart', handleClick, { passive: false });

    // ----- Старт игры -----
    function initGame() {
        setHeroStart();
        generateItems();
        gameRunning = true;
        gameLoop();
    }

    // Если изображения уже загружены
    if (bgImg.complete && heroImg.complete) {
        if (imagesLoaded < 2) imagesLoaded = 2;
        initGame();
    }
</script>
</body>
</html>
