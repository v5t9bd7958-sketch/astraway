<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Космический Сад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;overflow:hidden;touch-action:none;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center}
#game{width:100vmin;height:177.78vmin;max-height:100vh;max-width:56.25vh;position:relative;background:linear-gradient(180deg,#0d1b2a,#1b263b,#415a77);overflow:hidden;border-radius:12px}
@media (orientation:landscape){#game{width:56.25vh;height:100vh}}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 2s infinite}
@keyframes tw{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.ground{position:absolute;bottom:0;width:100%;height:28%;background:linear-gradient(180deg,#2d4a3e,#1a2f1d);border-radius:50% 50% 0 0/15% 15% 0 0}
.obj{position:absolute;cursor:pointer;z-index:10;transition:transform .2s}
.obj:active{transform:scale(.92)}
.glow{animation:gl 1.5s infinite ease-in-out}
@keyframes gl{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.4))}50%{filter:drop-shadow(0 0 12px rgba(255,255,255,.8))}}
.capsule{width:14vmin;height:20vmin;background:linear-gradient(135deg,#e0e1dd,#778da9,#415a77);border-radius:7vmin 7vmin 3vmin 3vmin;box-shadow:inset .5vmin .5vmin 2vmin rgba(255,255,255,.3),1vmin 1vmin 4vmin rgba(0,0,0,.4);position:relative}
.capsule::before{content:"";position:absolute;top:3vmin;left:3vmin;right:3vmin;height:5vmin;background:rgba(100,200,255,.3);border-radius:2.5vmin;box-shadow:0 0 3vmin rgba(100,200,255,.5)}
.capsule.s{animation:br 3s infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.capsule.o{animation:op 1s forwards}
@keyframes op{to{transform:translateY(-3vmin) rotate(-5deg);opacity:.6}}
.astro{width:8vmin;height:10vmin;background:radial-gradient(circle at 40% 40%,#f4f1de,#e0e1dd,#adb5bd);border-radius:50% 50% 45% 45%;position:absolute;box-shadow:.5vmin .5vmin 2vmin rgba(0,0,0,.3);display:none}
.astro::before{content:"";position:absolute;top:1.5vmin;left:1.2vmin;width:5vmin;height:3vmin;background:linear-gradient(180deg,#1d3557,#457b9d);border-radius:1.5vmin;border:.4vmin solid #a8dadc}
.astro::after{content:"";position:absolute;top:2.5vmin;left:2vmin;width:1.5vmin;height:1.5vmin;background:#f1faee;border-radius:50%;box-shadow:2vmin 0 0 #f1faee}
.mush{width:10vmin;height:12vmin;position:relative;transform:scale(0)}
.mush-c{width:10vmin;height:6vmin;background:radial-gradient(circle at 30% 30%,#e63946,#9d0208);border-radius:50% 50% 40% 40%;position:absolute;top:0}
.mush-c::after{content:"";position:absolute;width:2vmin;height:2vmin;background:rgba(255,255,255,.8);border-radius:50%;top:1vmin;left:2vmin;box-shadow:3.5vmin .5vmin 0 rgba(255,255,255,.6),2vmin 3vmin 0 rgba(255,255,255,.5)}
.mush-s{width:3.5vmin;height:6vmin;background:linear-gradient(90deg,#f1faee,#e0e1dd,#adb5bd);border-radius:0 0 1.5vmin 1.5vmin;position:absolute;bottom:0;left:3.25vmin}
.mush.g{animation:gr .8s forwards}
@keyframes gr{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1)}}
.bird{width:9vmin;height:6vmin;position:relative}
.bird-b{width:7vmin;height:5vmin;background:linear-gradient(135deg,#a8dadc,#457b9d);border-radius:50% 50% 40% 60%;position:absolute}
.bird-w{width:5vmin;height:3vmin;background:linear-gradient(135deg,#f1faee,#a8dadc);border-radius:50%;position:absolute;top:.5vmin;right:-1vmin;transform-origin:left center;animation:fl .4s infinite alternate}
@keyframes fl{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.bird-be{width:0;height:0;border-left:2vmin solid #f4a261;border-top:1vmin solid transparent;border-bottom:1vmin solid transparent;position:absolute;right:-1.5vmin;top:1.5vmin}
.bird.fa{animation:fa 2s forwards}
@keyframes fa{to{transform:translate(50vmin,-40vmin) scale(.3);opacity:0}}
.cryst{width:0;height:0;border-left:4vmin solid transparent;border-right:4vmin solid transparent;border-bottom:10vmin solid rgba(100,200,255,.85);position:relative;filter:drop-shadow(0 0 3vmin rgba(100,200,255,.7))}
.cryst::after{content:"";position:absolute;left:-2vmin;top:5vmin;border-left:2vmin solid transparent;border-right:2vmin solid transparent;border-top:5vmin solid rgba(150,220,255,.6)}
.tree{width:12vmin;height:18vmin;position:relative}
.tree-tr{width:3vmin;height:8vmin;background:linear-gradient(90deg,#4a3728,#6f4e37,#3d2817);position:absolute;bottom:0;left:4.5vmin;border-radius:0 0 1vmin 1vmin}
.tree-cr{width:12vmin;height:12vmin;background:radial-gradient(circle at 40% 40%,#7c9885,#52796f,#2f3e46);border-radius:50%;position:absolute;top:0}
.tree.sh{animation:sh .5s}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.stone{width:10vmin;height:7vmin;background:radial-gradient(circle at 30% 30%,#8d99ae,#5c677d,#3d5a80);border-radius:40% 60% 50% 50%;box-shadow:.8vmin .8vmin 2vmin rgba(0,0,0,.4)}
.stone.fl{animation:fl 3s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-2vmin)}}
.vine{width:1.5vmin;background:linear-gradient(180deg,#52796f,#2f3e46);border-radius:.75vmin;position:absolute;transform-origin:top center}
.vine.sw{animation:sw 2s infinite}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.gear{width:12vmin;height:12vmin;background:conic-gradient(from 0deg,#8d99ae,#5c677d,#8d99ae,#5c677d,#8d99ae,#5c677d,#8d99ae,#5c677d);border-radius:50%;position:relative;border:.6vmin solid #3d5a80;box-shadow:0 0 3vmin rgba(141,153,174,.3)}
.gear::before{content:"";position:absolute;inset:3.5vmin;background:#1b263b;border-radius:50%;border:.4vmin solid #5c677d}
.gear.sp{animation:sp 2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.orb{width:7vmin;height:7vmin;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4f1de,#e9c46a,#f4a261);box-shadow:0 0 3vmin rgba(244,162,97,.5);cursor:pointer;transition:transform .3s}
.orb:hover{transform:scale(1.15)}
.slot{width:8vmin;height:8vmin;border-radius:50%;border:.4vmin dashed rgba(255,255,255,.2);background:rgba(0,0,0,.2);position:absolute}
.ui{position:absolute;top:0;left:0;right:0;padding:3vmin;display:flex;justify-content:space-between;z-index:100}
.badge{background:rgba(0,0,0,.4);padding:1.5vmin 3vmin;border-radius:3vmin;color:#f1faee;font-size:3vmin;letter-spacing:.5vmin;border:.1vmin solid rgba(255,255,255,.1)}
.hint{width:8vmin;height:8vmin;border-radius:50%;background:rgba(0,0,0,.4);border:.1vmin solid rgba(255,255,255,.1);color:#f1faee;font-size:4vmin;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dlg{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);background:rgba(13,27,42,.92);padding:3vmin 4vmin;border-radius:3vmin;color:#f1faee;font-size:3.2vmin;text-align:center;max-width:80%;border:.1vmin solid rgba(255,255,255,.1);z-index:50;opacity:0;transition:opacity .5s;pointer-events:none}
.dlg.s{opacity:1}
.win{position:absolute;inset:0;background:rgba(10,14,23,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:200;opacity:0;pointer-events:none;transition:opacity 1s}
.win.s{opacity:1;pointer-events:auto}
.win h2{color:#f1faee;font-size:6vmin;margin-bottom:2vmin;text-align:center}
.win p{color:#a8dadc;font-size:3.5vmin;margin-bottom:6vmin;padding:0 8vmin;text-align:center;line-height:1.5}
.win button{background:linear-gradient(135deg,#457b9d,#1d3557);color:#f1faee;border:none;padding:4vmin 10vmin;border-radius:5vmin;font-size:4vmin;cursor:pointer;box-shadow:0 1vmin 5vmin rgba(69,123,157,.4)}
.spl{position:absolute;inset:0;background:#0a0e17;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:300;transition:opacity 1s}
.spl.f{opacity:0;pointer-events:none}
.spl h1{color:#f1faee;font-size:8vmin;margin-bottom:2vmin;letter-spacing:1vmin;text-align:center}
.spl p{color:#778da9;font-size:3.5vmin;letter-spacing:1.5vmin;text-align:center}
.spl .sh{margin-top:8vmin;color:#a8dadc;font-size:3vmin;animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:.4}50%{opacity:1}}
.tr{position:absolute;inset:0;background:#0a0e17;z-index:150;opacity:0;pointer-events:none;transition:opacity .8s;display:flex;justify-content:center;align-items:center;color:#f1faee;font-size:5vmin}
.tr.s{opacity:1;pointer-events:auto}
.part{position:absolute;width:1vmin;height:1vmin;background:#f4f1de;border-radius:50%;pointer-events:none;animation:pf 1s forwards}
@keyframes pf{to{transform:translateY(-20vmin);opacity:0}}
.done{pointer-events:none;opacity:.3}
.label{position:absolute;color:rgba(255,255,255,.5);font-size:2.5vmin;white-space:nowrap;pointer-events:none;text-shadow:0 0 1vmin rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="game">
<div class="spl" id="spl"><h1>КОСМИЧЕСКИЙ САД</h1><p>головоломка в духе Samorost</p><p class="sh">коснитесь экрана, чтобы начать</p></div>
<div class="ui"><div class="badge" id="lb">УРОВЕНЬ 1</div><div class="hint" onclick="sh()">?</div></div>
<div class="dlg" id="dlg"></div><div class="tr" id="tr"></div>
<div class="win" id="win"><h2>✨ Путешествие завершено</h2><p>Вы помогли астронавту проснуться, перейти через пропасть и запустить древний механизм.</p><button onclick="tg.shareGame&&tg.shareGame()">Поделиться</button></div>
<div id="s1">
<div style="position:absolute;width:55vmin;height:55vmin;top:12%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,#7c9885,#3d5a40,#1a2f1d);box-shadow:inset -3vmin -3vmin 8vmin rgba(0,0,0,.5),0 0 10vmin rgba(124,152,133,.2)"></div>
<div class="ground"></div>
<div class="obj capsule s glow" id="cap" style="bottom:30%;left:50%;transform:translateX(-50%)" onclick="cc()"></div>
<div class="label" style="bottom:27%;left:50%;transform:translateX(-50%)">💊 капсула</div>
<div class="astro" id="a1" style="bottom:31%;left:50%;transform:translateX(-50%)"></div>
<div class="obj mush glow" id="mu" style="bottom:24%;left:15%" onclick="cm()"><div class="mush-c"></div><div class="mush-s"></div></div>
<div class="label" style="bottom:21%;left:15%">🍄 гриб</div>
<div class="obj bird glow" id="bi" style="top:16%;right:15%" onclick="cb()"><div class="bird-b"></div><div class="bird-w"></div><div class="bird-be"></div></div>
<div class="label" style="top:22%;right:15%">🐦 птица</div>
<div class="obj cryst glow" id="cr1" style="bottom:34%;right:12%" onclick="c1()"></div>
<div class="label" style="bottom:31%;right:12%">💎 кристалл</div>
<div class="obj tree glow" id="tr1" style="bottom:22%;right:8%" onclick="ct1()"><div class="tree-cr"></div><div class="tree-tr"></div></div>
<div class="label" style="bottom:19%;right:8%">🌳 дерево</div>
</div>
<div id="s2" style="display:none">
<div style="position:absolute;width:60vmin;height:60vmin;top:10%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,#52796f,#2f3e46,#1a2f1d)"></div>
<div class="ground" style="background:linear-gradient(180deg,#354f52,#1a2f1d)"></div>
<div class="astro" id="a2" style="bottom:28%;left:10%;display:block"></div>
<div style="position:absolute;bottom:0;left:32%;width:36%;height:28%;background:linear-gradient(180deg,#0a0e17,#1b263b);border-radius:50% 50% 0 0"></div>
<div class="obj stone fl glow" id="st1" style="bottom:24%;left:26%" onclick="cs(1)"></div>
<div class="obj stone glow" id="st2" style="bottom:22%;left:42%;opacity:.3" onclick="cs(2)"></div>
<div class="obj stone fl glow" id="st3" style="bottom:25%;left:56%" onclick="cs(3)"></div>
<div class="obj vine sw glow" id="vi" style="top:0;left:48%;height:35vmin" onclick="cv()"></div>
<div class="obj cryst glow" id="cr2" style="bottom:36%;left:72%" onclick="c2()"></div>
<div style="position:absolute;bottom:28%;right:8%;width:10vmin;height:12vmin;background:radial-gradient(circle,#f4f1de,#e9c46a);border-radius:50%;box-shadow:0 0 8vmin rgba(233,196,106,.4);opacity:.6"></div>
</div>
<div id="s3" style="display:none">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0d1b2a,#1b263b,#415a77)"></div>
<div class="astro" id="a3" style="bottom:16%;left:50%;transform:translateX(-50%);display:block"></div>
<div style="position:absolute;bottom:12%;left:50%;transform:translateX(-50%);width:30vmin;height:15vmin;background:linear-gradient(180deg,#5c677d,#3d5a80);border-radius:2vmin 2vmin 0 0"></div>
<div class="obj gear glow" id="g1" style="top:16%;left:18%" onclick="cg(1)"></div>
<div class="obj gear glow" id="g2" style="top:12%;left:45%" onclick="cg(2)"></div>
<div class="obj gear glow" id="g3" style="top:18%;right:18%" onclick="cg(3)"></div>
<div class="obj orb glow" id="o1" style="bottom:36%;left:12%" onclick="co(1)"></div>
<div class="obj orb glow" id="o2" style="bottom:40%;right:12%" onclick="co(2)"></div>
<div class="obj orb glow" id="o3" style="top:30%;left:50%;transform:translateX(-50%)" onclick="co(3)"></div>
<div class="slot" id="sl1" style="bottom:24%;left:28%"></div>
<div class="slot" id="sl2" style="bottom:24%;left:50%;transform:translateX(-50%)"></div>
<div class="slot" id="sl3" style="bottom:24%;right:28%"></div>
<div id="fs" style="position:absolute;top:8%;left:50%;transform:translateX(-50%);width:14vmin;height:14vmin;background:radial-gradient(circle,#f4f1de,#e9c46a);border-radius:50%;box-shadow:0 0 12vmin rgba(233,196,106,.6);opacity:0;transition:opacity 2s"></div>
</div>
</div><script>
let tg=window.Telegram.WebApp;tg.expand();tg.ready();
let g=document.getElementById('game');
for(let i=0;i<40;i++){let s=document.createElement('div');s.className='star';s.style.width=Math.random()*2+.5+'vmin';s.style.height=s.style.width;s.style.left=Math.random()*100+'%';s.style.top=Math.random()*60+'%';s.style.animationDelay=Math.random()*2+'s';g.insertBefore(s,g.firstChild)}
let lv=1,sc=0,hu=0;
let st={1:{c:false,m:false,b:false,t:false,p:false},2:{s:[false,false,false],v:false,d:false},3:{g:[false,false,false],o:[false,false,false],op:[null,null,null]}};
document.getElementById('spl').addEventListener('click',function(){this.classList.add('f');setTimeout(()=>{this.style.display='none';sd('Космический сад погрузился в сон. Помоги астронавту проснуться...')},1000)});
function sd(t){let d=document.getElementById('dlg');d.textContent=t;d.classList.add('s');setTimeout(()=>d.classList.remove('s'),4000)}
function sh(){hu++;let h={1:'Начни с кристалла (справа, синий). Потом гриб, птица, дерево, капсула.',2:'Возьми кристалл, сруби лиану, строй мост слева направо.',3:'Запусти шестерёнки. Сферы: светлая, золотая, янтарная.'};sd(h[lv])}
function pa(x,y,c='#f4f1de'){for(let i=0;i<6;i++){let p=document.createElement('div');p.className='part';p.style.left=x+(Math.random()-.5)*20+'px';p.style.top=y+(Math.random()-.5)*20+'px';p.style.background=c;p.style.animationDelay=Math.random()*.3+'s';g.appendChild(p);setTimeout(()=>p.remove(),1200)}}
function c1(){if(st[1].c)return;st[1].c=true;document.getElementById('cr1').classList.add('done');pa(document.getElementById('cr1').offsetLeft+20,document.getElementById('cr1').offsetTop+20,'#64c8ff');sd('Кристалл засветился ярче...');setTimeout(()=>{document.getElementById('mu').classList.add('g');document.getElementById('mu').style.transform='scale(1)'},1500)}
function cm(){if(!st[1].c||st[1].m)return;st[1].m=true;document.getElementById('mu').classList.add('done');pa(document.getElementById('mu').offsetLeft+15,document.getElementById('mu').offsetTop+10,'#e63946');sd('Гриб выпустил споры. Птица заметила...')}
function cb(){if(!st[1].m||st[1].b)return;st[1].b=true;let b=document.getElementById('bi');b.classList.add('fa');pa(b.offsetLeft+12,b.offsetTop+8,'#a8dadc');sd('Птица взлетела! Дерево зашевелилось.');setTimeout(()=>b.style.display='none',2000)}
function ct1(){if(!st[1].b||st[1].t)return;st[1].t=true;document.getElementById('tr1').classList.add('sh');pa(document.getElementById('tr1').offsetLeft+20,document.getElementById('tr1').offsetTop+10,'#7c9885');sd('С дерева упал лучик света на капсулу...');setTimeout(()=>{if(!st[1].p)cc()},2000)}
function cc(){if(st[1].p)return;if(!st[1].t){sd('Капсула заперта. Нужен свет, чтобы разбудить спящего.');return}st[1].p=true;document.getElementById('cap').classList.remove('s');document.getElementById('cap').classList.add('o');document.getElementById('cap').classList.add('done');setTimeout(()=>{document.getElementById('a1').style.display='block';sd('Астронавт проснулся! Пора идти дальше...');sc+=100-hu*10;setTimeout(nl,3000)},1000)}
function c2(){if(st[2].d)return;st[2].d=true;document.getElementById('cr2').classList.add('done');pa(document.getElementById('cr2').offsetLeft+12,document.getElementById('cr2').offsetTop+15,'#64c8ff');sd('Кристалл теперь у тебя. Он притягивает камни...')}
function cv(){if(st[2].v)return;st[2].v=true;let v=document.getElementById('vi');v.style.transform='rotate(45deg) translateY(40px)';v.style.opacity='.5';pa(v.offsetLeft+4,v.offsetTop+60,'#52796f');sd('Лиана упала, придавив первый камень.');setTimeout(()=>cs(1),1000)}
function cs(n){if(st[2].s[n-1])return;if(n===2&&!st[2].s[0]){sd('Сначала уложи первый камень.');return}if(n===3&&!st[2].s[1]){sd('Мост не достаёт до берега.');return}st[2].s[n-1]=true;let s=document.getElementById('st'+n);s.classList.remove('fl');s.style.opacity='1';s.style.bottom='22%';s.style.transform='translateY(0)';pa(s.offsetLeft+15,s.offsetTop+12,'#8d99ae');if(n===1)sd('Первый камень на месте.');if(n===2)sd('Два камня. Ещё один.');if(n===3){sd('Мост построен!');setTimeout(()=>{let a=document.getElementById('a2');a.style.transition='left 2s';a.style.left='78%';sc+=100-hu*10;setTimeout(nl,2500)},1500)}}
function cg(n){if(st[3].g[n-1])return;st[3].g[n-1]=true;document.getElementById('g'+n).classList.add('sp');pa(document.getElementById('g'+n).offsetLeft+20,document.getElementById('g'+n).offsetTop+20,'#8d99ae');let all=st[3].g.every(x=>x);sd(all?'Механизм ожил! Расставь сферы.':'Шестерёнка закрутилась. Запусти остальные.')}
function co(n){if(!st[3].g.every(x=>x)){sd('Сначала запусти все шестерёнки.');return}let i=st[3].o.indexOf(false);if(i===-1)return;st[3].o[i]=true;st[3].op[i]=n;let o=document.getElementById('o'+n),sl=document.getElementById('sl'+(i+1));o.style.pointerEvents='none';let sr=sl.getBoundingClientRect(),cr=g.getBoundingClientRect();o.style.position='absolute';o.style.left=(sr.left-cr.left+1)+'px';o.style.bottom=(cr.height-sr.bottom+1)+'px';o.style.transition='all .5s';pa(o.offsetLeft+12,o.offsetTop+12,'#e9c46a');let all=st[3].o.every(x=>x);if(all){let ok=st[3].op.every((x,j)=>x===[3,1,2][j]);if(ok){sd('Механизм заработал! Звезда ожила...');setTimeout(()=>{document.getElementById('fs').style.opacity='1';document.getElementById('a3').style.transition='bottom 2s';document.getElementById('a3').style.bottom='36%';sc+=200-hu*10;setTimeout(()=>{document.getElementById('win').classList.add('s');tg.sendData&&tg.sendData(JSON.stringify({score:sc,hints:hu}))},3000)},1500)}else{sd('Порядок нарушен. Попробуй снова.');setTimeout(()=>{st[3].o=[false,false,false];st[3].op=[null,null,null];for(let k=1;k<=3;k++){let x=document.getElementById('o'+k);x.style.pointerEvents='auto';x.style.position='';x.style.left='';x.style.bottom='';x.style.top='';x.style.right='';if(k===1){x.style.bottom='36%';x.style.left='12%'}if(k===2){x.style.bottom='40%';x.style.right='12%'}if(k===3){x.style.top='30%';x.style.left='50%';x.style.transform='translateX(-50%)'}}},2000)}}}
