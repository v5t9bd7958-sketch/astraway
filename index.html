<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Samorost-like Mini Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: manipulation;
        }
        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('https://i.pinimg.com/474x/9e/ff/f1/9efff1486823532e0bfd43330bff8eed.jpg') center/cover no-repeat;
            overflow: hidden;
        }
        /* Портретная ориентация */
        @media (orientation: landscape) {
            #game {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: center;
                position: absolute;
                top: 50%;
                left: 50%;
                margin-top: -50vw;
                margin-left: -50vh;
            }
        }
        .character {
            position: absolute;
            width: 12%;
            height: auto;
            transition: none;
            pointer-events: none;
            z-index: 10;
            will-change: transform, left, top;
        }
        .character img {
            width: 100%;
            height: auto;
            display: block;
        }
        .item {
            position: absolute;
            width: 8%;
            height: auto;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
            will-change: transform;
        }
        .item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .item.active {
            animation: itemPulse 1s ease infinite;
        }
        @keyframes itemPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .leaf {
            position: absolute;
            width: 3%;
            height: auto;
            opacity: 0.8;
            pointer-events: none;
            z-index: 5;
            animation: floatLeaf linear infinite;
        }
        @keyframes floatLeaf {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        /* Анимация радости героя */
        .character.joy {
            animation: jumpJoy 0.6s ease;
        }
        @keyframes jumpJoy {
            0% { transform: translateY(0); }
            30% { transform: translateY(-20px) scale(1.1); }
            60% { transform: translateY(0) scale(0.95); }
            100% { transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div id="game">
        <!-- Герой -->
        <div class="character" id="hero">
            <img src="https://static.vecteezy.com/system/resources/previews/023/329/249/large_2x/smart-boy-cartoon-free-download-free-png.png" alt="hero">
        </div>
        <!-- Предметы (7 штук) будут добавлены через JS -->
        <!-- Анимированные листья будут добавлены через JS -->
    </div>

    <script>
        (function(){
            // ---------- НАСТРОЙКИ ----------
            const HERO_SPEED = 0.12; // доля расстояния в секунду (регулирует скорость)
            const STEP_INTERVAL = 0.25; // интервал между шагами (в секундах)

            // ---------- ДАННЫЕ УЗЛОВ И ГРАФА ----------
            // Координаты в процентах от ширины и высоты игрового поля
            const nodes = [
                { id: 0, x: 50, y: 85 },  // старт, основание ствола
                { id: 1, x: 50, y: 70 },  // ствол
                { id: 2, x: 42, y: 60 },  // левая ветка
                { id: 3, x: 58, y: 60 },  // правая ветка
                { id: 4, x: 34, y: 50 },  // дальняя левая
                { id: 5, x: 66, y: 50 },  // дальняя правая
                { id: 6, x: 50, y: 42 },  // развилка
                { id: 7, x: 38, y: 32 },  // верхняя левая
                { id: 8, x: 62, y: 32 },  // верхняя правая
                { id: 9, x: 50, y: 22 },  // верхушка
            ];

            // Рёбра графа (соединения между узлами)
            const edges = [
                [0, 1],
                [1, 2],
                [1, 3],
                [2, 4],
                [3, 5],
                [1, 6],
                [6, 7],
                [6, 8],
                [6, 9],
            ];

            // Предметы (id узла, на котором находится предмет)
            const itemNodes = [2, 3, 4, 5, 7, 8, 9];
            const items = itemNodes.map(nodeId => ({
                nodeId,
                activated: false,
                element: null
            }));

            // ---------- СОСТОЯНИЕ ИГРЫ ----------
            let heroNode = 0;              // текущий узел героя
            let heroX = nodes[0].x, heroY = nodes[0].y; // текущие координаты героя (в %)
            let targetPath = [];           // массив узлов пути
            let currentSegment = 0;        // индекс текущего сегмента пути
            let isMoving = false;
            let stepTimer = 0;
            let audioCtx = null;

            // DOM элементы
            const game = document.getElementById('game');
            const heroEl = document.getElementById('hero');

            // ---------- ИНИЦИАЛИЗАЦИЯ ----------
            function init() {
                // Установка стартовой позиции героя
                setPosition(heroEl, heroX, heroY);
                // Создание предметов
                createItems();
                // Создание листьев
                createLeaves();
                // Запуск фоновой музыки
                initAudio();
                startBackgroundMusic();
                // Обработчик тапов
                game.addEventListener('click', onGameClick);
                // Запуск игрового цикла
                requestAnimationFrame(gameLoop);
            }

            // Установить позицию элемента по процентам
            function setPosition(el, xPercent, yPercent) {
                el.style.left = xPercent + '%';
                el.style.top = yPercent + '%';
                el.style.transform = 'translate(-50%, -50%)';
            }

            // Создание предметов
            function createItems() {
                items.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.dataset.index = index;
                    // Временная заглушка: светящийся круг
                    div.innerHTML = `<svg viewBox="0 0 100 100" width="100%">
                        <circle cx="50" cy="50" r="40" fill="gold" stroke="orange" stroke-width="5"/>
                        <circle cx="50" cy="50" r="30" fill="yellow"/>
                    </svg>`;
                    const node = nodes[item.nodeId];
                    setPosition(div, node.x, node.y);
                    game.appendChild(div);
                    item.element = div;

                    // Обработчик клика на предмет
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (item.activated) return;
                        onClickItem(item);
                    });
                });
            }

            // Создание падающих листьев
            function createLeaves() {
                const leafCount = 6;
                for (let i = 0; i < leafCount; i++) {
                    const leaf = document.createElement('div');
                    leaf.className = 'leaf';
                    leaf.innerHTML = `<svg viewBox="0 0 100 100" width="100%">
                        <path d="M50 10 Q80 30 50 90 Q20 30 50 10" fill="#7cb342"/>
                    </svg>`;
                    leaf.style.left = Math.random() * 90 + '%';
                    leaf.style.top = '-10%';
                    leaf.style.animationDuration = (Math.random() * 8 + 6) + 's';
                    leaf.style.animationDelay = Math.random() * 10 + 's';
                    game.appendChild(leaf);
                }
            }

            // ---------- АУДИО ----------
            function initAudio() {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Фоновая расслабляющая музыка (простая генерируемая)
            function startBackgroundMusic() {
                if (!audioCtx) return;
                const masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.15;
                masterGain.connect(audioCtx.destination);

                // Несколько осцилляторов с медленной модуляцией
                const notes = [220, 277.18, 329.63, 440]; // A3, C#4, E4, A4
                let noteIndex = 0;
                function playNextNote() {
                    if (!audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = notes[noteIndex % notes.length];
                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 3);
                    noteIndex++;
                    setTimeout(playNextNote, 1500 + Math.random() * 1000);
                }
                playNextNote();

                // Лёгкий шум ветра (опционально)
            }

            // Звук шагов
            function playStepSound() {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = 100 + Math.random() * 50;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }

            // Звук монет
            function playCoinSound() {
                if (!audioCtx) return;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.value = 800;
                osc2.frequency.value = 1200;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 0.4);
                osc2.stop(audioCtx.currentTime + 0.4);
            }

            // ---------- ЛОГИКА ДВИЖЕНИЯ ----------
            // Найти путь по графу от startNodeId до endNodeId (BFS)
            function findPath(startNodeId, endNodeId) {
                if (startNodeId === endNodeId) return [startNodeId];
                const graph = {};
                nodes.forEach(n => graph[n.id] = []);
                edges.forEach(([a, b]) => {
                    graph[a].push(b);
                    graph[b].push(a);
                });
                const queue = [startNodeId];
                const visited = new Set([startNodeId]);
                const parent = {};
                while (queue.length > 0) {
                    const current = queue.shift();
                    if (current === endNodeId) break;
                    for (const neighbor of graph[current]) {
                        if (!visited.has(neighbor)) {
                            visited.add(neighbor);
                            parent[neighbor] = current;
                            queue.push(neighbor);
                        }
                    }
                }
                if (!(endNodeId in parent) && startNodeId !== endNodeId) return null;
                const path = [endNodeId];
                let cur = endNodeId;
                while (cur !== startNodeId) {
                    cur = parent[cur];
                    path.unshift(cur);
                }
                return path;
            }

            // Запустить движение героя к предмету
            function moveHeroToItem(item) {
                const path = findPath(heroNode, item.nodeId);
                if (!path || path.length === 0) return;
                targetPath = path;
                currentSegment = 0;
                isMoving = true;
                stepTimer = 0;
            }

            // Обновление позиции героя в игровом цикле
            function updateMovement(deltaTime) {
                if (!isMoving || currentSegment >= targetPath.length - 1) {
                    // Достигли конца пути
                    if (isMoving) {
                        isMoving = false;
                        // Прибыли к предмету
                        const targetNodeId = targetPath[targetPath.length - 1];
                        const item = items.find(it => it.nodeId === targetNodeId && !it.activated);
                        if (item) {
                            activateItem(item);
                        }
                        heroNode = targetNodeId;
                        targetPath = [];
                    }
                    return;
                }

                const fromNode = nodes[targetPath[currentSegment]];
                const toNode = nodes[targetPath[currentSegment + 1]];
                const fromX = fromNode.x, fromY = fromNode.y;
                const toX = toNode.x, toY = toNode.y;
                const distance = Math.hypot(toX - fromX, toY - fromY);
                const speed = distance * HERO_SPEED; // в процентах в секунду
                const step = speed * deltaTime;

                // Текущее смещение от fromNode
                const currentX = heroX, currentY = heroY;
                const distToTarget = Math.hypot(toX - currentX, toY - currentY);

                if (distToTarget <= step) {
                    // Прибыли в toNode
                    heroX = toX;
                    heroY = toY;
                    currentSegment++;
                    // Обновить поворот героя
                    updateHeroRotation(fromX, fromY, toX, toY);
                    // Проиграть шаг
                    playStepSound();
                    stepTimer = 0;
                } else {
                    // Двигаемся к toNode
                    const ratio = step / distToTarget;
                    heroX += (toX - currentX) * ratio;
                    heroY += (toY - currentY) * ratio;
                    // Поворот в зависимости от направления
                    updateHeroRotation(currentX, currentY, heroX, heroY);
                }

                // Звук шагов по таймеру
                stepTimer += deltaTime;
                if (stepTimer >= STEP_INTERVAL) {
                    playStepSound();
                    stepTimer = 0;
                }

                // Применить позицию
                setPosition(heroEl, heroX, heroY);
            }

            // Обновить ориентацию героя
            function updateHeroRotation(prevX, prevY, newX, newY) {
                const dx = newX - prevX;
                const dy = newY - prevY;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                // По умолчанию герой смотрит вправо (0 градусов)
                // Если dx отрицателен, отражаем по горизонтали
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx < 0) {
                        heroEl.style.transform = 'translate(-50%, -50%) scaleX(-1)';
                    } else {
                        heroEl.style.transform = 'translate(-50%, -50%) scaleX(1)';
                    }
                } else {
                    // Вертикальное движение — можно оставить без отражения
                    heroEl.style.transform = 'translate(-50%, -50%)';
                }
                // Лёгкий наклон при ходьбе (анимация будет через CSS)
            }

            // Активация предмета
            function activateItem(item) {
                if (item.activated) return;
                item.activated = true;
                playCoinSound();
                // Анимация радости героя
                heroEl.classList.add('joy');
                setTimeout(() => heroEl.classList.remove('joy'), 600);
                // Анимация предмета
                item.element.classList.add('active');
                // Можно изменить внешний вид предмета (например, поменять цвет)
                item.element.style.filter = 'brightness(1.5)';
                // Отметить, что предмет собран
                console.log(`Предмет ${item.nodeId} активирован!`);
                // Проверка завершения всех предметов
                if (items.every(it => it.activated)) {
                    setTimeout(() => alert('Поздравляем! Все предметы собраны!'), 500);
                }
            }

            // Обработчик клика по игровому полю
            function onGameClick(e) {
                // Проверяем, не кликнули ли по предмету (это обрабатывается отдельно)
                const target = e.target;
                if (target.closest('.item')) return;
                // Если клик не по предмету, можно проигнорировать или переместить к ближайшему узлу
                // Для простоты игнорируем
            }

            // Обработчик клика по предмету
            function onClickItem(item) {
                if (isMoving) return; // не прерываем текущее движение
                if (item.activated) return;
                moveHeroToItem(item);
            }

            // ---------- ИГРОВОЙ ЦИКЛ ----------
            let lastTime = performance.now();
            function gameLoop(timestamp) {
                const deltaTime = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                if (deltaTime > 0.1) deltaTime = 0.1; // избегаем больших скачков

                updateMovement(deltaTime);

                requestAnimationFrame(gameLoop);
            }

            // Запуск после загрузки
            window.addEventListener('load', init);
            // Для мобильных устройств: активация аудио после первого касания
            document.addEventListener('touchstart', () => {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }, { once: true });
        })();
    </script>
</body>
</html>
