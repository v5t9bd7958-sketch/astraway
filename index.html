<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>Звёздный Садовник</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
    }
    #game-canvas {
      display: block;
      touch-action: none;
    }
    #ui-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.8s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-star {
      width: 60px; height: 60px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    .loading-text {
      color: #aabbee;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin-top: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .loading-bar {
      width: 120px; height: 2px;
      background: #1a1a3a;
      margin-top: 16px;
      border-radius: 1px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #6b8cce;
      transition: width 0.3s ease;
    }
    #dialogue-box {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(90%, 360px);
      background: rgba(10, 12, 30, 0.92);
      border: 1px solid rgba(107, 140, 206, 0.3);
      border-radius: 16px;
      padding: 16px 20px;
      color: #ccd6f0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #dialogue-box.visible { opacity: 1; }
    #dialogue-box .dialogue-title {
      color: #6b8cce;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    #inventory-bar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .inv-slot {
      width: 48px; height: 48px;
      background: rgba(10, 12, 30, 0.85);
      border: 1.5px solid rgba(107, 140, 206, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
    }
    .inv-slot.active {
      border-color: #6b8cce;
      box-shadow: 0 0 12px rgba(107, 140, 206, 0.4);
      transform: scale(1.08);
    }
    .inv-slot canvas { width: 32px; height: 32px; }
    #hint-btn {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      width: 40px; height: 40px;
      background: rgba(10, 12, 30, 0.85);
      border: 1.5px solid rgba(107, 140, 206, 0.25);
      border-radius: 50%;
      color: #6b8cce;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #hint-btn:active { transform: scale(0.92); }
    #completion-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(5, 6, 18, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      pointer-events: auto;
    }
    #completion-screen.visible { display: flex; }
    .completion-title {
      color: #e8d5a3;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }
    .completion-sub {
      color: #8899bb;
      font-size: 14px;
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .completion-btn {
      background: rgba(107, 140, 206, 0.2);
      border: 1px solid rgba(107, 140, 206, 0.5);
      color: #aabbee;
      padding: 12px 32px;
      border-radius: 24px;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .completion-btn:active {
      background: rgba(107, 140, 206, 0.35);
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <svg class="loading-star" viewBox="0 0 100 100">
      <path d="M50 5 L61 38 L95 38 L68 58 L79 91 L50 71 L21 91 L32 58 L5 38 L39 38 Z" fill="#6b8cce" opacity="0.8"/>
      <circle cx="50" cy="50" r="8" fill="#e8d5a3" opacity="0.9"/>
    </svg>
    <div class="loading-text">Загрузка</div>
    <div class="loading-bar"><div class="loading-bar-fill" id="loading-fill"></div></div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="ui-layer">
    <div id="hint-btn">?</div>
    <div id="inventory-bar"></div>
    <div id="dialogue-box">
      <div class="dialogue-title" id="dialogue-title"></div>
      <div id="dialogue-text"></div>
    </div>
    <div id="completion-screen">
      <div class="completion-title">Сцена завершена</div>
      <div class="completion-sub">Древо ожило. Портал открылся.<br>Куда он ведёт — узнаем в следующей главе.</div>
      <button class="completion-btn" id="restart-btn">Начать сначала</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
