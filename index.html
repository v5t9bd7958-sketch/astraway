<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Космический Сад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0a0e17;overflow:hidden;touch-action:none;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center}
#game{width:100%;height:100%;max-width:500px;position:relative;background:linear-gradient(180deg,#0d1b2a,#1b263b,#415a77);overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:t 2s infinite}
@keyframes t{0%,100%{opacity:.3}50%{opacity:1}}
.ground{position:absolute;bottom:0;width:100%;height:35%;background:linear-gradient(180deg,#2d4a3e,#1a2f1d);border-radius:50% 50% 0 0/20% 20% 0 0}
.obj{position:absolute;cursor:pointer;transition:transform .3s;z-index:10}
.obj:active{transform:scale(.9)}
.capsule{width:60px;height:90px;background:linear-gradient(135deg,#e0e1dd,#778da9,#415a77);border-radius:30px 30px 15px 15px;box-shadow:inset 3px 3px 10px rgba(255,255,255,.3),5px 5px 20px rgba(0,0,0,.4);position:relative}
.capsule::before{content:'';position:absolute;top:15px;left:15px;right:15px;height:25px;background:rgba(100,200,255,.3);border-radius:12px;box-shadow:0 0 10px rgba(100,200,255,.5)}
.capsule.s{animation:b 3s infinite}
@keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.capsule.o{animation:o 1s forwards}
@keyframes o{to{transform:translateY(-20px) rotate(-5deg);opacity:.7}}
.astro{width:35px;height:45px;background:radial-gradient(circle at 40% 40%,#f4f1de,#e0e1dd,#adb5bd);border-radius:50% 50% 45% 45%;position:absolute;box-shadow:2px 2px 10px rgba(0,0,0,.3);display:none}
.astro::before{content:'';position:absolute;top:8px;left:6px;width:22px;height:14px;background:linear-gradient(180deg,#1d3557,#457b9d);border-radius:10px;border:2px solid #a8dadc}
.astro::after{content:'';position:absolute;top:12px;left:10px;width:6px;height:6px;background:#f1faee;border-radius:50%;box-shadow:8px 0 0 #f1faee}
.mush{width:40px;height:50px;position:relative;transform:scale(0)}
.mush-c{width:40px;height:25px;background:radial-gradient(circle at 30% 30%,#e63946,#9d0208);border-radius:50% 50% 40% 40%;position:absolute;top:0}
.mush-c::after{content:'';position:absolute;width:8px;height:8px;background:rgba(255,255,255,.8);border-radius:50%;top:5px;left:8px;box-shadow:15px 3px 0 rgba(255,255,255,.6),8px 12px 0 rgba(255,255,255,.5)}
.mush-s{width:14px;height:28px;background:linear-gradient(90deg,#f1faee,#e0e1dd,#adb5bd);border-radius:0 0 7px 7px;position:absolute;bottom:0;left:13px}
.mush.g{animation:g .8s forwards}
@keyframes g{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1)}}
.bird{width:35px;height:25px;position:relative}
.bird-b{width:30px;height:20px;background:linear-gradient(135deg,#a8dadc,#457b9d);border-radius:50% 50% 40% 60%;position:absolute}
.bird-w{width:20px;height:12px;background:linear-gradient(135deg,#f1faee,#a8dadc);border-radius:50%;position:absolute;top:2px;right:-5px;transform-origin:left center;animation:f .4s infinite alternate}
@keyframes f{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.bird-be{width:0;height:0;border-left:8px solid #f4a261;border-top:4px solid transparent;border-bottom:4px solid transparent;position:absolute;right:-6px;top:6px}
.bird.fa{animation:fa 2s forwards}
@keyframes fa{to{transform:translate(200px,-150px) scale(.3);opacity:0}}
.cryst{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:40px solid rgba(100,200,255,.8);position:relative;filter:drop-shadow(0 0 10px rgba(100,200,255,.6))}
.cryst::after{content:'';position:absolute;left:-8px;top:20px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:20px solid rgba(150,220,255,.6)}
.tree{width:50px;height:80px;position:relative}
.tree-tr{width:12px;height:35px;background:linear-gradient(90deg,#4a3728,#6f4e37,#3d2817);position:absolute;bottom:0;left:19px;border-radius:0 0 4px 4px}
.tree-cr{width:50px;height:50px;background:radial-gradient(circle at 40% 40%,#7c9885,#52796f,#2f3e46);border-radius:50%;position:absolute;top:0}
.tree.sh{animation:sh .5s}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.stone{width:45px;height:30px;background:radial-gradient(circle at 30% 30%,#8d99ae,#5c677d,#3d5a80);border-radius:40% 60% 50% 50%;box-shadow:3px 3px 10px rgba(0,0,0,.4)}
.stone.fl{animation:fl 3s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.vine{width:8px;background:linear-gradient(180deg,#52796f,#2f3e46);border-radius:4px;position:absolute;transform-origin:top center}
.vine.sw{animation:sw 2s infinite}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.gear{width:50px;height:50px;background:conic-gradient(from 0deg,#8d99ae,#5c677d,#8d99ae,#5c677d,#8d99ae,#5c677d,#8d99ae,#5c677d);border-radius:50%;position:relative;border:3px solid #3d5a80;box-shadow:0 0 15px rgba(141,153,174,.3)}
.gear::before{content:'';position:absolute;inset:15px;background:#1b263b;border-radius:50%;border:2px solid #5c677d}
.gear.sp{animation:sp 2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4f1de,#e9c46a,#f4a261);box-shadow:0 0 15px rgba(244,162,97,.5);cursor:pointer;transition:transform .3s}
.orb:hover{transform:scale(1.15)}
.slot{width:36px;height:36px;border-radius:50%;border:2px dashed rgba(255,255,255,.2);background:rgba(0,0,0,.2);position:absolute}
.ui{position:absolute;top:0;left:0;right:0;padding:15px;display:flex;justify-content:space-between;z-index:100}
.badge{background:rgba(0,0,0,.4);padding:8px 16px;border-radius:20px;color:#f1faee;font-size:13px}
.hint{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);color:#f1faee;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dlg{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(13,27,42,.9);padding:16px 24px;border-radius:16px;color:#f1faee;font-size:14px;text-align:center;max-width:85%;opacity:0;transition:opacity .5s;pointer-events:none;z-index:50}
.dlg.s{opacity:1}
.win{position:absolute;inset:0;background:rgba(10,14,23,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:200;opacity:0;pointer-events:none;transition:opacity 1s}
.win.s{opacity:1;pointer-events:auto}
.win h2{color:#f1faee;font-size:28px;margin-bottom:10px}
.win p{color:#a8dadc;font-size:14px;margin-bottom:30px;padding:0 30px;text-align:center}
.win button{background:linear-gradient(135deg,#457b9d,#1d3557);color:#f1faee;border:none;padding:14px 40px;border-radius:30px;font-size:16px;cursor:pointer}
.spl{position:absolute;inset:0;background:#0a0e17;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:300;transition:opacity 1s}
.spl.f{opacity:0;pointer-events:none}
.spl h1{color:#f1faee;font-size:32px;letter-spacing:3px;animation:tf 3s infinite}
@keyframes tf{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.spl p{color:#778da9;font-size:13px;letter-spacing:2px}
.tr{position:absolute;inset:0;background:#0a0e17;z-index:150;opacity:0;pointer-events:none;transition:opacity .8s;display:flex;justify-content:center;align-items:center;color:#f1faee;font-size:18px}
.tr.s{opacity:1;pointer-events:auto}
.part{position:absolute;width:4px;height:4px;background:#f4f1de;border-radius:50%;pointer-events:none;animation:pf 1s forwards}
@keyframes pf{to{transform:translateY(-50px);opacity:0}}
.done{pointer-events:none;opacity:.3}
</style>
</head>
<body>
<div id="game">
<div class="spl" id="spl"><h1>КОСМИЧЕСКИЙ САД</h1><p>головоломка в духе Samorost</p><p style="margin-top:40px;color:#a8dadc;font-size:12px;animation:p 2s infinite">коснитесь экрана, чтобы начать</p></div>
<div class="ui"><div class="badge" id="lb">УРОВЕНЬ 1</div><div class="hint" onclick="sh()">?</div></div>
<div class="dlg" id="dlg"></div>
<div class="tr" id="tr"></div>
<div class="win" id="win"><h2>✨ Путешествие завершено</h2><p>Вы помогли астронавту проснуться, перейти через пропасть и запустить древний механизм.</p><button onclick="tg.shareGame&&tg.shareGame()">Поделиться</button></div>

<div id="s1">
<div style="position:absolute;width:280px;height:280px;top:15%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,#7c9885,#3d5a40,#1a2f1d);box-shadow:inset -10px -10px 30px rgba(0,0,0,.5)"></div>
<div class="ground"></div>
<div class="obj capsule s" id="cap" style="bottom:28%;left:50%;transform:translateX(-50%)" onclick="cc()"></div>
<div class="astro" id="a1" style="bottom:30%;left:50%;transform:translateX(-50%)"></div>
<div class="obj mush" id="mu" style="bottom:25%;left:15%" onclick="cm()"><div class="mush-c"></div><div class="mush-s"></div></div>
<div class="obj bird" id="bi" style="top:25%;right:20%" onclick="cb()"><div class="bird-b"></div><div class="bird-w"></div><div class="bird-be"></div></div>
<div class="obj cryst" id="cr1" style="bottom:32%;right:18%" onclick="c1()"></div>
<div class="obj tree" id="tr1" style="bottom:22%;right:5%" onclick="ct1()"><div class="tree-cr"></div><div class="tree-tr"></div></div>
</div>

<div id="s2" style="display:none">
<div style="position:absolute;width:320px;height:320px;top:10%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,#52796f,#2f3e46,#1a2f1d)"></div>
<div class="ground" style="background:linear-gradient(180deg,#354f52,#1a2f1d)"></div>
<div class="astro" id="a2" style="bottom:28%;left:10%;display:block"></div>
<div style="position:absolute;bottom:0;left:35%;width:30%;height:35%;background:linear-gradient(180deg,#0a0e17,#1b263b);border-radius:50% 50% 0 0"></div>
<div class="obj stone fl" id="st1" style="bottom:25%;left:32%" onclick="cs(1)"></div>
<div class="obj stone" id="st2" style="bottom:22%;left:45%;opacity:.3" onclick="cs(2)"></div>
<div class="obj stone fl" id="st3" style="bottom:26%;left:58%" onclick="cs(3)"></div>
<div class="obj vine sw" id="vi" style="top:0;left:48%;height:180px" onclick="cv()"></div>
<div class="obj cryst" id="cr2" style="bottom:35%;left:75%" onclick="c2()"></div>
<div style="position:absolute;bottom:30%;right:8%;width:40px;height:50px;background:radial-gradient(circle,#f4f1de,#e9c46a);border-radius:50%;box-shadow:0 0 30px rgba(233,196,106,.4);opacity:.6"></div>
</div>

<div id="s3" style="display:none">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0d1b2a,#1b263b,#415a77)"></div>
<div class="astro" id="a3" style="bottom:15%;left:50%;transform:translateX(-50%);display:block"></div>
<div style="position:absolute;bottom:10%;left:50%;transform:translateX(-50%);width:120px;height:60px;background:linear-gradient(180deg,#5c677d,#3d5a80);border-radius:10px 10px 0 0"></div>
<div class="obj gear" id="g1" style="top:20%;left:20%" onclick="cg(1)"></div>
<div class="obj gear" id="g2" style="top:15%;left:45%" onclick="cg(2)"></div>
<div class="obj gear" id="g3" style="top:22%;right:20%" onclick="cg(3)"></div>
<div class="obj orb" id="o1" style="bottom:35%;left:15%" onclick="co(1)"></div>
<div class="obj orb" id="o2" style="bottom:40%;right:15%" onclick="co(2)"></div>
<div class="obj orb" id="o3" style="top:35%;left:50%;transform:translateX(-50%)" onclick="co(3)"></div>
<div class="slot" id="sl1" style="bottom:25%;left:30%"></div>
<div class="slot" id="sl2" style="bottom:25%;left:50%;transform:translateX(-50%)"></div>
<div class="slot" id="sl3" style="bottom:25%;right:30%"></div>
<div id="fs" style="position:absolute;top:10%;left:50%;transform:translateX(-50%);width:60px;height:60px;background:radial-gradient(circle,#f4f1de,#e9c46a);border-radius:50%;box-shadow:0 0 50px rgba(233,196,106,.6);opacity:0;transition:opacity 2s"></div>
</div>
</div>
<script>
let tg=window.Telegram.WebApp;tg.expand();tg.ready();
let g=document.getElementById('game');
for(let i=0;i<30;i++){let s=document.createElement('div');s.className='star';s.style.width=Math.random()*3+1+'px';s.style.height=s.style.width;s.style.left=Math.random()*100+'%';s.style.top=Math.random()*60+'%';s.style.animationDelay=Math.random()*2+'s';g.insertBefore(s,g.firstChild)}
let lv=1,sc=0,hu=0;
let st={1:{c:false,m:false,b:false,t:false,p:false},2:{s:[false,false,false],v:false,d:false},3:{g:[false,false,false],o:[false,false,false],op:[null,null,null]}};

document.getElementById('spl').addEventListener('click',function(){this.classList.add('f');setTimeout(()=>{this.style.display='none';sd('Космический сад погрузился в сон. Помоги астронавту проснуться...')},1000)});

function sd(t){let d=document.getElementById('dlg');d.textContent=t;d.classList.add('s');setTimeout(()=>d.classList.remove('s'),3500)}
function sh(){hu++;let h={1:'Начни с кристалла. Потом гриб, птица, дерево, капсула.',2:'Возьми кристалл, сруби лиану, строй мост слева направо.',3:'Запусти шестерёнки. Сферы: светлая, золотая, янтарная.'};sd(h[lv])}
function pa(x,y,c='#f4f1de'){for(let i=0;i<6;i++){let p=document.createElement('div');p.className='part';p.style.left=x+(Math.random()-.5)*30+'px';p.style.top=y+(Math.random()-.5)*30+'px';p.style.background=c;p.style.animationDelay=Math.random()*.3+'s';g.appendChild(p);setTimeout(()=>p.remove(),1200)}}

function c1(){if(st[1].c)return;st[1].c=true;document.getElementById('cr1').classList.add('done');pa(document.getElementById('cr1').offsetLeft+20,document.getElementById('cr1').offsetTop+20,'#64c8ff');sd('Кристалл засветился... Что-то пробуждается в земле.');setTimeout(()=>{document.getElementById('mu').classList.add('g');document.getElementById('mu').style.transform='scale(1)'},1500)}
function cm(){if(!st[1].c||st[1].m)return;st[1].m=true;document.getElementById('mu').classList.add('done');pa(document.getElementById('mu').offsetLeft+20,document.getElementById('mu').offsetTop+10,'#e63946');sd('Гриб выпустил споры. Птица заметила движение...')}
function cb(){if(!st[1].m||st[1].b)return;st[1].b=true;let b=document.getElementById('bi');b.classList.add('fa');pa(b.offsetLeft+15,b.offsetTop+10,'#a8dadc');sd('Птица взлетела и спела мелодию. Дерево зашевелилось.');setTimeout(()=>b.style.display='none',2000)}
function ct1(){if(!st[1].b||st[1].t)return;st[1].t=true;document.getElementById('tr1').classList.add('sh');pa(document.getElementById('tr1').offsetLeft+25,document.getElementById('tr1').offsetTop+10,'#7c9885');sd('С дерева упал лучик света на капсулу...');setTimeout(()=>{if(!st[1].p)cc()},2000)}
function cc(){if(st[1].p)return;if(!st[1].t){sd('Капсула заперта. Нужен свет, чтобы разбудить спящего.');return}st[1].p=true;document.getElementById('cap').classList.remove('s');document.getElementById('cap').classList.add('o');document.getElementById('cap').classList.add('done');setTimeout(()=>{document.getElementById('a1').style.display='block';sd('Астронавт проснулся! Пора идти дальше...');sc+=100-hu*10;setTimeout(nl,3000)},1000)}

function c2(){if(st[2].d)return;st[2].d=true;document.getElementById('cr2').classList.add('done');pa(document.getElementById('cr2').offsetLeft+15,document.getElementById('cr2').offsetTop+20,'#64c8ff');sd('Кристалл теперь у тебя. Он притягивает камни...')}
function cv(){if(st[2].v)return;st[2].v=true;let v=document.getElementById('vi');v.style.transform='rotate(45deg) translateY(50px)';v.style.opacity='.5';pa(v.offsetLeft+5,v.offsetTop+80,'#52796f');sd('Лиана упала, придавив первый камень.');setTimeout(()=>cs(1),1000)}
function cs(n){if(st[2].s[n-1])return;if(n===2&&!st[2].s[0]){sd('Сначала уложи первый камень.');return}if(n===3&&!st[2].s[1]){sd('Мост не достаёт до берега.');return}st[2].s[n-1]=true;let s=document.getElementById('st'+n);s.classList.remove('fl');s.style.opacity='1';s.style.bottom='20%';s.style.transform='translateY(0)';pa(s.offsetLeft+20,s.offsetTop+15,'#8d99ae');if(n===1)sd('Первый камень на месте.');if(n===2)sd('Два камня. Ещё один.');if(n===3){sd('Мост построен!');setTimeout(()=>{let a=document.getElementById('a2');a.style.transition='left 2s';a.style.left='80%';sc+=100-hu*10;setTimeout(nl,2500)},1500)}}

function cg(n){if(st[3].g[n-1])return;st[3].g[n-1]=true;document.getElementById('g'+n).classList.add('sp');pa(document.getElementById('g'+n).offsetLeft+25,document.getElementById('g'+n).offsetTop+25,'#8d99ae');let all=st[3].g.every(x=>x);sd(all?'Механизм ожил! Расставь сферы.':'Шестерёнка закрутилась. Запусти остальные.')}
function co(n){if(!st[3].g.every(x=>x)){sd('Сначала запусти все шестерёнки.');return}let i=st[3].o.indexOf(false);if(i===-1)return;st[3].o[i]=true;st[3].op[i]=n;let o=document.getElementById('o'+n),sl=document.getElementById('sl'+(i+1));o.style.pointerEvents='none';let sr=sl.getBoundingClientRect(),cr=g.getBoundingClientRect();o.style.position='absolute';o.style.left=(sr.left-cr.left+3)+'px';o.style.bottom=(cr.height-sr.bottom+3)+'px';o.style.transition='all .5s';pa(o.offsetLeft+15,o.offsetTop+15,'#e9c46a');let all=st[3].o.every(x=>x);if(all){let ok=st[3].op.every((x,j)=>x===[3,1,2][j]);if(ok){sd('Механизм заработал! Звезда ожила...');setTimeout(()=>{document.getElementById('fs').style.opacity='1';document.getElementById('a3').style.transition='bottom 2s';document.getElementById('a3').style.bottom='40%';sc+=200-hu*10;setTimeout(()=>{document.getElementById('win').classList.add('s');tg.sendData&&tg.sendData(JSON.stringify({score:sc,hints:hu}))},3000)},1500)}else{sd('Порядок нарушен. Попробуй снова.');setTimeout(()=>{st[3].o=[false,false,false];st[3].op=[null,null,null];for(let k=1;k<=3;k++){let x=document.getElementById('o'+k);x.style.pointerEvents='auto';x.style.position='';x.style.left='';x.style.bottom='';x.style.top='';x.style.right='';if(k===1){x.style.bottom='35%';x.style.left='15%'}if(k===2){x.style.bottom='40%';x.style.right='15%'}if(k===3){x.style.top='35%';x.style.left='50%';x.style.transform='translateX(-50%)'}}},2000)}}}

function nl(){let t=document.getElementById('tr');t.textContent='Уровень '+(lv+1);t.classList.add('s');setTimeout(()=>{document.getElementById('s'+lv).style.display='none';lv++;document.getElementById('s'+lv).style.display='block';document.getElementById('lb').textContent='УРОВЕНЬ '+lv;if(lv===2)setTimeout(()=>sd('Перед астронавтом пропасть. Построй мост.'),800);if(lv===3)setTimeout(()=>sd('Древний механизм. Запусти шестерёнки и расставь сферы.'),800);setTimeout(()=>t.classList.remove('s'),1200)},1000)}
</script>
</body>
</html>
