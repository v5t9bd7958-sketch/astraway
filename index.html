<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>ASTRAWAY</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main id="game-container">

        <canvas id="game-canvas"></canvas>

        <div id="hud">

            <div id="hud-left">
                <div id="game-title">ASTRAWAY</div>
            </div>

            <div id="hud-right">
                <button id="hint-button" type="button">?</button>
                <button id="sound-button" type="button">♪</button>
            </div>

        </div>

        <div id="message" aria-live="polite"></div>

        <section id="start-screen" class="screen">

            <div class="screen-card">

                <h1>ASTRAWAY</h1>

                <p>
                    Иногда путь начинается<br>
                    там, где его никто не видит.
                </p>

                <button id="start-button" type="button">
                    НАЧАТЬ
                </button>

            </div>

        </section>

        <section id="victory-screen" class="screen hidden">

            <div class="screen-card">

                <h1>ПУТЬ ОТКРЫТ</h1>

                <p id="victory-text">
                    Ты нашёл всё, что искал.
                </p>

                <button id="restart-button" type="button">
                    ЕЩЁ РАЗ
                </button>

            </div>

        </section>

    </main>

    <script type="module" src="./engine/main.js"></script>

</body>
</html>
