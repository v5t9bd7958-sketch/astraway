<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Samorost Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('https://i.pinimg.com/474x/9e/ff/f1/9efff1486823532e0bfd43330bff8eed.jpg') center/cover no-repeat;
            overflow: hidden;
            background-color: #2d4a22;
        }
        @media (orientation: landscape) {
            #game {
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }

        #hero {
            position: absolute;
            width: 14%;
            height: auto;
            pointer-events: none;
            z-index: 10;
            will-change: transform, left, top;
        }
        #hero img {
            width: 100%;
            height: auto;
            display: block;
            animation: walkAnim 0.3s ease-in-out infinite;
            animation-play-state: paused;
        }
        #hero.walking img {
            animation-play-state: running;
        }
        #hero.joy img {
            animation: joyAnim 0.6s ease;
        }
        @keyframes walkAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6%); }
        }
        @keyframes joyAnim {
            0% { transform: translateY(0) rotateZ(0deg); }
            30% { transform: translateY(-18%) rotateZ(-8deg); }
            60% { transform: translateY(0) rotateZ(8deg); }
            100% { transform: translateY(0) rotateZ(0deg); }
        }

        .item {
            position: absolute;
            width: 8%;
            height: auto;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
            transition: filter 0.3s ease, opacity 0.3s ease;
            will-change: transform, opacity, filter;
        }
        .item svg {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(255,215,0,0.8));
        }
        .item.locked {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(1);
        }
        .item.active {
            animation: itemPulse 1.5s ease-in-out infinite;
            pointer-events: auto;
            cursor: pointer;
        }
        .item.activating {
            animation: itemActivate 3s ease forwards;
            pointer-events: none;
        }
        @keyframes itemPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes itemActivate {
            0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 6px gold); }
            30% { transform: scale(1.8); opacity: 1; filter: drop-shadow(0 0 25px white); }
            100% { transform: scale(2.2); opacity: 0; filter: drop-shadow(0 0 40px white); }
        }

        .leaf {
            position: absolute;
            width: 4%;
            height: auto;
            pointer-events: none;
            z-index: 5;
            animation: fall linear infinite;
        }
        .leaf svg {
            width: 100%;
            height: auto;
            display: block;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotateZ(0deg); opacity: 0.8; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotateZ(360deg); opacity: 0; }
        }

        #modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #modal.show {
            visibility: visible;
            opacity: 1;
        }
        #modal .message {
            color: #fff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }
        #restartBtn {
            background: #ffd700;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            color: #333;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #restartBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="hero">
            <img id="heroImg" src="https://static.vecteezy.com/system/resources/previews/023/329/249/large_2x/smart-boy-cartoon-free-download-free-png.png" alt="hero" crossorigin="anonymous">
        </div>
        <!-- items and leaves will be appended here -->
        <div id="modal">
            <div class="message">Поздравляем!<br>Все предметы собраны!</div>
            <button id="restartBtn">Играть снова</button>
        </div>
    </div>

    <script>
    (function() {
        // ===== КОНСТАНТЫ =====
        const HERO_SPEED = 0.15; // доля расстояния между узлами в секунду
        const STEP_INTERVAL = 0.25; // сек между шагами
        const ACTIVATION_DURATION = 3000; // мс

        // Узлы графа (проценты)
        const nodes = [
            { id: 0, x: 50, y: 85 }, // старт
            { id: 1, x: 50, y: 70 },
            { id: 2, x: 42, y: 60 },
            { id: 3, x: 58, y: 60 },
            { id: 4, x: 34, y: 50 },
            { id: 5, x: 66, y: 50 },
            { id: 6, x: 50, y: 42 },
            { id: 7, x: 38, y: 32 },
            { id: 8, x: 62, y: 32 },
            { id: 9, x: 50, y: 22 }
        ];

        // Рёбра
        const edges = [
            [0, 1], [1, 2], [1, 3], [2, 4], [3, 5],
            [1, 6], [6, 7], [6, 8], [6, 9]
        ];

        // Предметы
        const itemDefs = [
            { nodeId: 2, type: 'coin' },
            { nodeId: 3, type: 'crystal' },
            { nodeId: 4, type: 'key' },
            { nodeId: 5, type: 'star' },
            { nodeId: 7, type: 'apple' },
            { nodeId: 8, type: 'gem' },
            { nodeId: 9, type: 'flower' }
        ];

        // ===== DOM =====
        const game = document.getElementById('game');
        const heroEl = document.getElementById('hero');
        const heroImg = document.getElementById('heroImg');
        const modal = document.getElementById('modal');
        const restartBtn = document.getElementById('restartBtn');

        // ===== СОСТОЯНИЕ =====
        let heroNodeId = 0;
        let heroX = nodes[0].x;
        let heroY = nodes[0].y;
        let targetPath = [];
        let currentSegment = 0;
        let isMoving = false;
        let isActivating = false;
        let activeItemIndex = 0;
        let itemElements = [];

        // Таймеры для отмены при рестарте
        let activationTimer = null;
        let joyTimer = null;

        // ===== АУДИО =====
        let audioCtx = null;
        let musicTimer = null;
        let musicGainNode = null;

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        function init() {
            updateHeroPosition();
            createItems();
            createLeaves();
            game.addEventListener('pointerup', onGamePointerUp);
            game.addEventListener('click', onGameClick); // запасной
            restartBtn.addEventListener('click', restartGame);
            document.addEventListener('visibilitychange', onVisibilityChange);
            document.addEventListener('pointerdown', initAudioOnFirstInteraction, { once: true });
            document.addEventListener('keydown', initAudioOnFirstInteraction, { once: true });

            heroImg.onerror = function() {
                heroImg.style.display = 'none';
                heroEl.style.backgroundColor = '#f0c0a0';
                heroEl.style.borderRadius = '50%';
                heroEl.style.aspectRatio = '1';
                heroEl.style.width = '14%';
            };
            requestAnimationFrame(gameLoop);
        }

        function createItems() {
            // Удаляем старые
            itemElements.forEach(el => el.remove());
            itemElements = [];

            itemDefs.forEach((def, index) => {
                const div = document.createElement('div');
                div.className = 'item locked';
                if (index === 0) {
                    div.classList.remove('locked');
                    div.classList.add('active');
                }
                div.dataset.index = index;
                div.style.left = nodes[def.nodeId].x + '%';
                div.style.top = nodes[def.nodeId].y + '%';
                div.innerHTML = getItemSVG(def.type);
                game.appendChild(div);
                itemElements.push(div);
            });
            activeItemIndex = 0;
        }

        function getItemSVG(type) {
            const map = {
                coin: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="gold" stroke="#b8860b" stroke-width="4"/><text x="50" y="65" font-size="50" text-anchor="middle" fill="#b8860b" font-weight="bold">$</text></svg>',
                crystal: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,5 80,95 20,95" fill="#7fffd4" stroke="#20b2aa" stroke-width="4"/><polygon points="50,5 80,95 50,95" fill="#40e0d0" opacity="0.6"/></svg>',
                key: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="12" fill="none" stroke="#ffd700" stroke-width="6"/><path d="M40 40 L90 90 M75 75 L85 85" stroke="#ffd700" stroke-width="6" fill="none"/></svg>',
                star: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,5 61,35 93,35 67,53 77,85 50,65 23,85 33,53 7,35 39,35" fill="#ffd700" stroke="#ff8c00" stroke-width="3"/></svg>',
                apple: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="60" r="35" fill="#ff4d4d" stroke="#8b0000" stroke-width="3"/><path d="M50 25 Q50 5 70 10" stroke="#8b4513" stroke-width="5" fill="none"/></svg>',
                gem: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,5 70,30 65,70 35,70 30,30" fill="#e0b0ff" stroke="#800080" stroke-width="4"/><polygon points="50,5 70,30 50,30 30,30" fill="#dda0dd" opacity="0.7"/></svg>',
                flower: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="15" fill="#ff69b4"/><circle cx="35" cy="35" r="12" fill="#ff1493"/><circle cx="65" cy="35" r="12" fill="#ff1493"/><circle cx="35" cy="65" r="12" fill="#ff1493"/><circle cx="65" cy="65" r="12" fill="#ff1493"/></svg>'
            };
            return map[type] || map.coin;
        }

        function createLeaves() {
            const leafContainer = document.createElement('div');
            leafContainer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
            game.appendChild(leafContainer);

            for (let i = 0; i < 8; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.style.left = Math.random() * 90 + '%';
                leaf.style.top = '-10%';
                leaf.style.animationDuration = (Math.random() * 6 + 6) + 's';
                leaf.style.animationDelay = Math.random() * 10 + 's';
                leaf.innerHTML = '<svg viewBox="0 0 100 100"><path d="M50 10 Q80 30 50 90 Q20 30 50 10" fill="#7cb342"/></svg>';
                leafContainer.appendChild(leaf);
            }
        }

        // ===== АУДИО ФУНКЦИИ =====
        function initAudioOnFirstInteraction() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.warn('WebAudio not supported');
                    return;
                }
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    startBackgroundMusic();
                }).catch(err => console.warn('Audio resume failed', err));
            } else {
                startBackgroundMusic();
            }
        }

        function startBackgroundMusic() {
            if (!audioCtx || musicTimer) return;
            musicGainNode = audioCtx.createGain();
            musicGainNode.gain.value = 0.15;
            musicGainNode.connect(audioCtx.destination);

            const notes = [220, 277.18, 329.63, 440];
            let noteIndex = 0;
            function playNextNote() {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = notes[noteIndex % notes.length];
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
                osc.connect(gain);
                gain.connect(musicGainNode);
                osc.start();
                osc.stop(audioCtx.currentTime + 3);
                noteIndex++;
                musicTimer = setTimeout(playNextNote, 1500 + Math.random() * 1000);
            }
            playNextNote();
        }

        function stopBackgroundMusic() {
            if (musicTimer) {
                clearTimeout(musicTimer);
                musicTimer = null;
            }
            if (musicGainNode) {
                musicGainNode.disconnect();
                musicGainNode = null;
            }
        }

        function playStepSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = 100 + Math.random() * 50;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playCoinSound() {
            if (!audioCtx) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.value = 800;
            osc2.frequency.value = 1200;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.4);
            osc2.stop(audioCtx.currentTime + 0.4);
        }

        // ===== ДВИЖЕНИЕ И ГРАФ =====
        function findPath(startNodeId, endNodeId) {
            if (startNodeId === endNodeId) return [startNodeId];
            const graph = {};
            nodes.forEach(n => graph[n.id] = []);
            edges.forEach(([a,b]) => {
                graph[a].push(b);
                graph[b].push(a);
            });
            const queue = [startNodeId];
            const visited = new Set([startNodeId]);
            const parent = {};
            while (queue.length) {
                const current = queue.shift();
                if (current === endNodeId) break;
                for (const neighbor of graph[current]) {
                    if (!visited.has(neighbor)) {
                        visited.add(neighbor);
                        parent[neighbor] = current;
                        queue.push(neighbor);
                    }
                }
            }
            if (!(endNodeId in parent)) return null;
            const path = [endNodeId];
            let cur = endNodeId;
            while (cur !== startNodeId) {
                cur = parent[cur];
                path.unshift(cur);
            }
            return path;
        }

        function startMovementToItem() {
            if (isMoving || isActivating || activeItemIndex >= itemElements.length) return;
            const targetNodeId = itemDefs[activeItemIndex].nodeId;
            const path = findPath(heroNodeId, targetNodeId);
            if (!path || path.length === 0) return;
            targetPath = path;
            currentSegment = 0;
            isMoving = true;
            heroEl.classList.add('walking');
        }

        function updateHeroPosition() {
            heroEl.style.left = heroX + '%';
            heroEl.style.top = heroY + '%';
        }

        function applyHeroTransform() {
            let transform = 'translate(-50%, -50%)';
            if (isMoving && targetPath.length > 1 && currentSegment < targetPath.length - 1) {
                const from = nodes[targetPath[currentSegment]];
                const to = nodes[targetPath[currentSegment + 1]];
                if (from && to) {
                    const dx = to.x - from.x;
                    const dy = to.y - from.y;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        transform += dx < 0 ? ' scaleX(-1)' : ' scaleX(1)';
                    } else if (dy !== 0) {
                        transform += dy < 0 ? ' rotateX(10deg)' : ' rotateX(-10deg)';
                    }
                }
            }
            heroEl.style.transform = transform;
        }

        function updateMovement(deltaTime) {
            if (!isMoving) return;
            if (currentSegment >= targetPath.length - 1) {
                // Достигли конечного узла
                isMoving = false;
                heroEl.classList.remove('walking');
                heroNodeId = targetPath[targetPath.length - 1];
                const activeNodeId = itemDefs[activeItemIndex].nodeId;
                if (heroNodeId === activeNodeId) {
                    startActivation();
                }
                targetPath = [];
                applyHeroTransform();
                return;
            }

            const from = nodes[targetPath[currentSegment]];
            const to = nodes[targetPath[currentSegment + 1]];
            const dist = Math.hypot(to.x - from.x, to.y - from.y);
            const step = dist * HERO_SPEED * deltaTime;
            const remaining = Math.hypot(to.x - heroX, to.y - heroY);

            if (remaining <= step) {
                heroX = to.x;
                heroY = to.y;
                currentSegment++;
                updateHeroPosition();
                applyHeroTransform();
                playStepSound();
            } else {
                const ratio = step / remaining;
                heroX += (to.x - heroX) * ratio;
                heroY += (to.y - heroY) * ratio;
                updateHeroPosition();
                applyHeroTransform();
            }
        }

        function startActivation() {
            if (isActivating || activeItemIndex >= itemElements.length) return;
            isActivating = true;
            const itemEl = itemElements[activeItemIndex];
            itemEl.classList.remove('active');
            itemEl.classList.add('activating');
            playCoinSound();

            heroEl.classList.add('joy');
            joyTimer = setTimeout(() => {
                heroEl.classList.remove('joy');
                joyTimer = null;
            }, 600);

            activationTimer = setTimeout(() => {
                itemEl.style.display = 'none';
                itemEl.classList.remove('activating');
                isActivating = false;
                activationTimer = null;

                activeItemIndex++;
                if (activeItemIndex < itemElements.length) {
                    itemElements[activeItemIndex].classList.remove('locked');
                    itemElements[activeItemIndex].classList.add('active');
                } else {
                    showWinModal();
                }
            }, ACTIVATION_DURATION);
        }

        // ===== ОБРАБОТЧИКИ =====
        function onGamePointerUp(e) {
            if (isMoving || isActivating) return;
            const target = e.target.closest('.item');
            if (!target) return;
            const index = parseInt(target.dataset.index);
            if (index === activeItemIndex && !target.classList.contains('locked')) {
                startMovementToItem();
            }
        }

        function onGameClick(e) {
            // Дублируем pointerup для совместимости
            if (isMoving || isActivating) return;
            const target = e.target.closest('.item');
            if (!target) return;
            const index = parseInt(target.dataset.index);
            if (index === activeItemIndex && !target.classList.contains('locked')) {
                startMovementToItem();
            }
        }

        function restartGame() {
            // Очистка таймеров
            if (activationTimer) {
                clearTimeout(activationTimer);
                activationTimer = null;
            }
            if (joyTimer) {
                clearTimeout(joyTimer);
                joyTimer = null;
            }

            // Сброс состояния
            heroNodeId = 0;
            heroX = nodes[0].x;
            heroY = nodes[0].y;
            targetPath = [];
            currentSegment = 0;
            isMoving = false;
            isActivating = false;
            activeItemIndex = 0;
            updateHeroPosition();
            applyHeroTransform();
            heroEl.classList.remove('walking', 'joy');

            // Пересоздаём предметы
            createItems();

            // Скрываем модальное окно
            modal.classList.remove('show');
        }

        function showWinModal() {
            modal.classList.add('show');
        }

        function onVisibilityChange() {
            if (document.hidden) {
                stopBackgroundMusic();
            } else {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (audioCtx && !musicTimer) {
                    startBackgroundMusic();
                }
            }
        }

        // ===== ИГРОВОЙ ЦИКЛ =====
        let lastTime = performance.now();
        let stepTimer = 0;
        function gameLoop(timestamp) {
            const deltaTime = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (isMoving) {
                stepTimer += deltaTime;
                if (stepTimer >= STEP_INTERVAL) {
                    playStepSound();
                    stepTimer = 0;
                }
            } else {
                stepTimer = 0;
            }

            updateMovement(deltaTime);
            requestAnimationFrame(gameLoop);
        }

        // Запуск
        init();
    })();
    </script>
</body>
</html>
