<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>Звёздный Садовник</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    #game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #0a0a1a; }

    #dialogue-box.visible { opacity: 1; }
    #dialogue-box .dialogue-title { color: #6b8cce; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
    #inventory-bar { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; pointer-events: auto; }
    .inv-slot { width: 48px; height: 48px; background: rgba(10, 12, 30, 0.85); border: 1.5px solid rgba(107, 140, 206, 0.25); border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; position: relative; }
    .inv-slot.active { border-color: #6b8cce; box-shadow: 0 0 12px rgba(107, 140, 206, 0.4); transform: scale(1.08); }
    .inv-slot canvas { width: 32px; height: 32px; }
    #hint-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; width: 40px; height: 40px; background: rgba(10, 12, 30, 0.85); border: 1.5px solid rgba(107, 140, 206, 0.25); border-radius: 50%; color: #6b8cce; font-size: 18px; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: pointer; transition: all 0.2s ease; }
    #hint-btn:active { transform: scale(0.92); }
    #completion-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 6, 18, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; pointer-events: auto; }
    #completion-screen.visible { display: flex; }
    .completion-title { color: #e8d5a3; font-size: 24px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; text-align: center; }
    .completion-sub { color: #8899bb; font-size: 14px; text-align: center; max-width: 280px; line-height: 1.6; margin-bottom: 32px; }
    .completion-btn { background: rgba(107, 140, 206, 0.2); border: 1px solid rgba(107, 140, 206, 0.5); color: #aabbee; padding: 12px 32px; border-radius: 24px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
    .completion-btn:active { background: rgba(107, 140, 206, 0.35); transform: scale(0.96); }
  </style>
</head>
<body>
  <div id="loading-screen">
    <svg class="loading-star" viewBox="0 0 100 100">
      <path d="M50 5 L61 38 L95 38 L68 58 L79 91 L50 71 L21 91 L32 58 L5 38 L39 38 Z" fill="#6b8cce" opacity="0.8"/>
      <circle cx="50" cy="50" r="8" fill="#e8d5a3" opacity="0.9"/>
    </svg>
    <div class="loading-text">Загрузка</div>
    <div class="loading-bar"><div class="loading-bar-fill" id="loading-fill"></div></div>
  </div>
  <div id="game-container"><canvas id="game-canvas"></canvas></div>
  <div id="ui-layer">
    <div id="hint-btn">?</div>
    <div id="inventory-bar"></div>
    <div id="dialogue-box"><div class="dialogue-title" id="dialogue-title"></div><div id="dialogue-text"></div></div>
    <div id="completion-screen">

      <div class="completion-sub">Древо ожило. Портал открылся.<br>Куда он ведёт — узнаем в следующей главе.</div>
      <button class="completion-btn" id="restart-btn">Начать сначала</button>
    </div>
  </div>
<script>
class Renderer {
  constructor(canvas) {

  }
  resize() {

    this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    if (this.aspect > da) { this.sceneScale = h / 1000; this.offsetX = (w - 1000 * this.sceneScale * (this.aspect / da)) / 2; this.offsetY = 0; }
    else { this.sceneScale = w / (1000 * da); this.offsetX = 0; this.offsetY = (h - 1000 * this.sceneScale) / 2; }
  }
  nx(x) { return this.offsetX + x * 562.5 * this.sceneScale; }
  ny(y) { return this.offsetY + y * 1000 * this.sceneScale; }
  ns(s) { return s * this.sceneScale; }
  unx(px) { return (px - this.offsetX) / (562.5 * this.sceneScale); }
  uny(py) { return (py - this.offsetY) / (1000 * this.sceneScale); }
  clear() { this.ctx.fillStyle = '#0a0a1a'; this.ctx.fillRect(0, 0, this.width, this.height); }
  drawStars(t) { const c = this.ctx, sd = 12345, rng = n => { let x = Math.sin(n * 127.1 + sd) * 43758.5453; return x - Math.floor(x); }; for (let i = 0; i < 150; i++) { const sx = rng(i * 3) * this.width, sy = rng(i * 3 + 1) * this.height * 0.7, sz = rng(i * 3 + 2) * 2 + 0.5, tw = Math.sin(t * 0.002 + i * 1.5) * 0.5 + 0.5; c.fillStyle = 'rgba(200,210,255,' + (0.3 + tw * 0.5) + ')'; c.beginPath(); c.arc(sx, sy, sz, 0, Math.PI * 2); c.fill(); } }

40 }, { bx: -6, by: -85, a: -0.9, l: 35 }, { bx: 6, by: -85, a: 0.8, l: 30 }]; db.forEach(b => { c.beginPath(); c.moveTo(x + b.bx * s, y + b.by * s); c.lineTo(x + b.bx * s + Math.cos(b.a) * b.l * s, y + b.by * s + Math.sin(b.a) * b.l * s); c.stroke(); }); } }

  drawMushroomColony(st, t) { const c = this.ctx, x = this.nx(0.22), y = this.ny(0.68), s = this.ns(1); c.fillStyle = '#2a1f35'; c.beginPath(); c.ellipse(x, y + 15 * s, 50 * s, 20 * s, 0, 0, Math.PI * 2); c.fill(); const ms = [{ dx: -25, dy: -5, h: 35, w: 18, hue: 280 }, { dx: 0, dy: 0, h: 45, w: 22, hue: 260 }, { dx: 22, dy: -3, h: 30, w: 16, hue: 300 }, { dx: -10, dy: 5, h: 25, w: 14, hue: 270 }, { dx: 14, dy: 8, h: 20, w: 12, hue: 290 }]; ms.forEach((m, i) => { const mx = x + m.dx * s, my = y + m.dy * s, br = Math.sin(t * 0.002 + i * 1.2) * 2 * s; c.fillStyle = '#c4b8d4'; c.beginPath(); c.ellipse(mx, my, m.w * 0.3 * s, m.h * 0.5 * s, 0, 0, Math.PI * 2); c.fill(); const cc = st.mushroomsHappy ? 'hsl(' + m.hue + ', 60%, 65%)' : 'hsl(' + m.hue + ', 30%, 40%)'; c.fillStyle = cc; c.beginPath(); c.ellipse(mx, my - m.h * 0.4 * s + br, m.w * s, m.h * 0.35 * s, 0, Math.PI, 0); c.fill(); if (st.mushroomsHappy) { c.fillStyle = 'rgba(255,255,255,0.4)'; c.beginPath(); c.arc(mx - 4 * s, my - m.h * 0.45 * s + br, 2 * s, 0, Math.PI * 2); c.arc(mx + 5 * s, my - m.h * 0.5 * s + br, 1.5 * s, 0, Math.PI * 2); c.fill(); } }); if (st.mushroomsHappy && !st.hasCrystal) { const cy = y - 55 * s + Math.sin(t * 0.003) * 3 * s; c.shadowColor = '#6b8cce'; c.shadowBlur = 15 * s; c.fillStyle = 'rgba(107,140,206,0.9)'; c.beginPath(); c.moveTo(x, cy - 15 * s); c.lineTo(x + 8 * s, cy); c.lineTo(x, cy + 20 * s); c.lineTo(x - 8 * s, cy); c.closePath(); c.fill(); c.shadowBlur = 0; } }
  drawSpiderWeb(st, t) { const c = this.ctx, x = this.nx(0.85), y = this.ny(0.42), s = this.ns(1); c.strokeStyle = 'rgba(180,190,220,0.25)'; c.lineWidth = 0.8 * s; for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * 45 * s, y + Math.sin(a) * 45 * s); c.stroke(); } for (let r = 10; r <= 40; r += 10) { c.beginPath(); c.arc(x, y, r * s, 0, Math.PI * 2); c.stroke(); } if (!st.hasDew) { const dy = y + 12 * s + Math.sin(t * 0.002) * 2 * s; c.fillStyle = 'rgba(150,200,255,0.7)'; c.beginPath(); c.arc(x + 5 * s, dy, 5 * s, 0, Math.PI * 2); c.fill(); c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.arc(x + 3.5 * s, dy - 1.5 * s, 1.5 * s, 0, Math.PI * 2); c.fill(); } }
  drawPortal(st, t) { if (!st.portalOpen) return; const c = this.ctx, x = this.nx(0.5), y = this.ny(0.35), s = this.ns(1), p = Math.sin(t * 0.003) * 0.1 + 0.9, r = t * 0.001; c.save(); c.translate(x, y); c.rotate(r); c.strokeStyle = 'rgba(107,140,206,' + (0.4 * p) + ')'; c.lineWidth = 3 * s; c.beginPath(); c.arc(0, 0, 50 * s, 0, Math.PI * 2); c.stroke(); for (let i = 0; i < 3; i++) { c.rotate(Math.PI * 2 / 3); c.strokeStyle = 'rgba(200,180,255,' + (0.3 * p) + ')'; c.lineWidth = 1.5 * s; c.beginPath(); c.arc(15 * s, 0, 30 * s, 0, Math.PI * 2); c.stroke(); } c.restore(); const g = c.createRadialGradient(x, y, 0, x, y, 40 * s); g.addColorStop(0, 'rgba(150,180,255,' + (0.3 * p) + ')'); g.addColorStop(1, 'rgba(150,180,255,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, 40 * s, 0, Math.PI * 2); c.fill(); }

    onInteract: () => {
      if (quest.can('COMPLETE') || quest.can('PORTAL_OPEN')) return;
      if (quest.can('MUSHROOMS_HAPPY') || quest.can('CRYSTAL_FOUND') || quest.can('CAPSULE_OPENED') || quest.can('SEED_FOUND')) { if (!inventory.has('crystal')) hero.walkTo(0.26, 0.76, () => { hero.inspect(); dialogue.show('Герой', 'Грибы довольны. Их кристалл теперь мой.'); }); else hero.walkTo(0.26, 0.76, () => { hero.inspect(); dialogue.show('Герой', 'Грибы радуются. Они такие милые, когда счастливы.'); }); return; }
      hero.walkTo(0.26, 0.76, () => { hero.inspect(); quest.setFlag('mushroomsInspected', true); dialogue.show('Герой', 'Грибная колония... Они выглядят увядшими. Над ними парит кристалл, но они его охраняют. Может, им чего-то не хватает?'); });
    },
    onUseItem: (item) => {
      if (item.id === 'dew' && (quest.can('DEW_FOUND') || quest.can('EXPLORED'))) { hero.walkTo(0.26, 0.76, () => { hero.useItem('dew'); inventory.consume('dew'); particles.burst(0.22, 0.62, '#88ccff', 20); setTimeout(() => { quest.transition('MUSHROOMS_HAPPY'); dialogue.show('Герой', 'Грибы впитали росу! Они расцвели и стали счастливы!'); hero.success(); setTimeout(() => { quest.transition('CRYSTAL_FOUND'); inventory.add({ id: 'crystal', name: 'Кристалл-ключ', icon: 'crystal', usableOn: ['capsule'] }); particles.burst(0.22, 0.55, '#6b8cce', 15); dialogue.show('Герой', 'Кристалл упал к моим лапам! Это ключ от капсулы!'); }, 1500); }, 1500); }); return true; }
      if (item.id === 'crystal') { hero.walkTo(0.26, 0.76, () => { hero.failure(); dialogue.show('Герой', 'Грибы не хотят забирать кристалл обратно. Они уже довольны.'); }); return true; }
      if (item.id === 'seed') { hero.walkTo(0.26, 0.76, () => { hero.failure(); dialogue.show('Герой', 'Грибам не нужно семя. Они хотят влаги.'); }); return true; }
      return false;
    }
  });
  objects.push({
    id: 'spiderweb', type: 'object', x: 0.85, y: 0.42, z: 12, w: 0.08, h: 0.10, hitW: 0.12, hitH: 0.14, interactive: true, highlighted: false,
    onInteract: () => {
      if (quest.can('COMPLETE') || quest.can('PORTAL_OPEN')) return;
      if (quest.can('DEW_FOUND') || quest.isAtLeast('MUSHROOMS_HAPPY')) { hero.walkTo(0.80, 0.55, () => { hero.inspect(); dialogue.show('Герой', 'Паутина пуста. Я уже взял каплю росы.'); }); return; }
      hero.walkTo(0.80, 0.55, () => { hero.interact(); quest.setFlag('webInspected', true); inventory.add({ id: 'dew', name: 'Капля росы', icon: 'dew', usableOn: ['mushrooms'] }); quest.transition('DEW_FOUND'); particles.burst(0.85, 0.42, '#88ccff', 15); dialogue.show('Герой', 'Капля росы на паутине! Она светится странным голубым светом. Возьму её с собой.'); hero.success(); });
    },
    onUseItem: (item) => { hero.walkTo(0.80, 0.55, () => { hero.failure(); dialogue.show('Герой', 'Здесь нечего использовать. Росу нужно отнести грибам.'); }); return true; }
  });
  objects.push({
    id: 'strange_plant', type: 'object', x: 0.88, y: 0.74, z: 6, w: 0.06, h: 0.10, hitW: 0.10, hitH: 0.12, interactive: true, highlighted: false,
    onInteract: () => { if (quest.can('COMPLETE')) return; hero.walkTo(0.84, 0.78, () => { hero.inspect(); const msgs = ['Странное растение... Оно шепчет что-то на языке, которого я не знаю.', 'Этот цветок пульсирует в такт моему сердцебиению. Жутко и прекрасно.', 'Растение кажется живым. Но оно не хочет со мной разговаривать.']; dialogue.show('Герой', msgs[Math.floor(Math.random() * msgs.length)]); }); },
    onUseItem: (item) => { hero.walkTo(0.84, 0.78, () => { hero.failure(); dialogue.show('Герой', 'Растение не реагирует. Оно слишком странное, чтобы понимать предметы.'); }); return true; }
  });
  objects.push({
    id: 'crystal_rock', type: 'object', x: 0.38, y: 0.76, z: 4, w: 0.05, h: 0.04, hitW: 0.08, hitH: 0.07, interactive: true, highlighted: false,
    onInteract: () => { if (quest.can('COMPLETE')) return; hero.walkTo(0.40, 0.80, () => { hero.inspect(); if (quest.can('START')) dialogue.show('Герой', 'Кристаллический камень... Он похож на замок той капсулы. Интересно, где найти ключ?'); else if (quest.can('EXPLORED') || quest.can('DEW_FOUND')) dialogue.show('Герой', 'Этот камень напоминает мне о капсуле. Нужен похожий кристалл, чтобы её открыть.'); else dialogue.show('Герой', 'Просто красивый камень. Ничего особенного.'); }); },
    onUseItem: () => { hero.walkTo(0.40, 0.80, () => { hero.failure(); dialogue.show('Герой', 'Камень слишком твёрдый. Ничего не выйдет.'); }); return true; }
  });
  return objects;
}

class HUD {
  constructor() {
    this.dialogueBox = document.getElementById('dialogue-box'); this.dialogueTitle = document.getElementById('dialogue-title'); this.dialogueText = document.getElementById('dialogue-text');
    this.inventoryBar = document.getElementById('inventory-bar'); this.hintBtn = document.getElementById('hint-btn');
    this.completionScreen = document.getElementById('completion-screen'); this.restartBtn = document.getElementById('restart-btn');
    this.dialogueTimer = null; this.onItemSelect = null; this.onRestart = null;
    this.hintBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); this.showHint(); });
    this.restartBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); if (this.onRestart) this.onRestart(); });
  }
  show(title, text, duration = 4000) { this.dialogueTitle.textContent = title; this.dialogueText.textContent = text; this.dialogueBox.classList.add('visible'); if (this.dialogueTimer) clearTimeout(this.dialogueTimer); this.dialogueTimer = setTimeout(() => { this.dialogueBox.classList.remove('visible'); }, duration); }
  showHint() { const game = window.__game, cs = game && game.quest ? game.quest.state : 'START'; const hints = { START: 'Осмотрите мёртвое древо в центре. Что-то здесь не так...', EXPLORED: 'Исследуйте окрестности. На астероиде есть странные объекты.', DEW_FOUND: 'Капля росы светится. Может, кому-то она нужна? Посмотрите на грибы.', MUSHROOMS_HAPPY: 'Грибы довольны и отдали вам кристалл. Где можно его использовать?', CRYSTAL_FOUND: 'Кристалл похож на ключ. Попробуйте им открыть капсулу.', CAPSULE_OPENED: 'В капсуле — семя! Возьмите его и найдите, куда его посадить.', SEED_FOUND: 'Звёздное семя нужно посадить в мёртвое древо.', TREE_PLANTED: 'Семя погружается в корни... Подождите немного.', TREE_GROWN: 'Древо ожило! Что-то происходит...', PORTAL_OPEN: 'Портал открылся! Сцена завершена.', COMPLETE: 'Вы прошли сцену! Нажмите "Начать сначала" чтобы сыграть ещё раз.' }; const hint = hints[cs] || 'Осмотрите всё вокруг. Нажимайте на объекты и пробуйте предметы из инвентаря.'; this.show('Подсказка', hint, 5000); }
  updateInventory(items, selected) { this.inventoryBar.innerHTML = ''; for (const item of items) { if (item.state === 'consumed') continue; const slot = document.createElement('div'); slot.className = 'inv-slot' + (item.id === selected ? ' active' : ''); const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64; const ctx = canvas.getContext('2d'); this.drawItemIcon(ctx, item.icon, 32, 32, 20); slot.appendChild(canvas); slot.addEventListener('pointerdown', (e) => { e.stopPropagation(); if (this.onItemSelect) this.onItemSelect(item.id); }); this.inventoryBar.appendChild(slot); } }
  drawItemIcon(ctx, icon, cx, cy, size) { if (icon === 'dew') { ctx.fillStyle = 'rgba(150,200,255,0.9)'; ctx.beginPath(); ctx.arc(cx, cy, size * 0.6, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(cx - size * 0.2, cy - size * 0.2, size * 0.2, 0, Math.PI * 2); ctx.fill(); } else if (icon === 'crystal') { ctx.shadowColor = '#6b8cce'; ctx.shadowBlur = 10; ctx.fillStyle = 'rgba(107,140,206,0.95)'; ctx.beginPath(); ctx.moveTo(cx, cy - size * 0.7); ctx.lineTo(cx + size * 0.5, cy); ctx.lineTo(cx, cy + size * 0.8); ctx.lineTo(cx - size * 0.5, cy); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; } else if (icon === 'seed') { ctx.shadowColor = '#e8d5a3'; ctx.shadowBlur = 12; ctx.fillStyle = '#e8d5a3'; ctx.beginPath(); ctx.arc(cx, cy, size * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(cx - size * 0.15, cy - size * 0.15, size * 0.15, 0, Math.PI * 2); ctx.fill(); } }
  showCompletion() { this.completionScreen.classList.add('visible'); }
  hideCompletion() { this.completionScreen.classList.remove('visible'); }
  hideDialogue() { this.dialogueBox.classList.remove('visible'); if (this.dialogueTimer) clearTimeout(this.dialogueTimer); }
}

class Game {
  constructor(canvas) {
    this.canvas = canvas; this.renderer = new Renderer(canvas); this.input = new InputManager(canvas, this.renderer);
    this.particles = new ParticleSystem(); this.hitbox = new HitboxEngine(); this.quest = new QuestSystem();
    this.inventory = new InventorySystem(); this.hero = new Hero(0.5, 0.78); this.hud = new HUD();
    this.objects = []; this.running = false; this.lastTime = 0; this.gameState = {};
    this._setupCallbacks(); this._createObjects(); this._setupInput();
   _setupCallbacks() {
    this.inventory.onChange((items, selected) => { this.hud.updateInventory(items, selected); this.hero.heldItem = selected; });
    this.hud.onItemSelect = (id) => { this.inventory.select(id); };
    this.hud.onRestart = () => { this.restart(); };
    this.quest.onTransition((oldState, newState) => { this._updateGameState(newState); });
    window.addEventListener('resize', () => { this.renderer.resize(); });
  }
  _createObjects() {
    this.objects = createSceneObjects(this.quest, this.inventory, this.hero, this.hud, this.particles);
    for (const obj of this.objects) this.hitbox.register(obj);
  }
  _updateGameState(state) {
    this.gameState = {
      treeAlive: state === QuestState.TREE_GROWN || state === QuestState.PORTAL_OPEN || state === QuestState.COMPLETE,
      capsuleOpen: state === QuestState.CAPSULE_OPENED || state === QuestState.SEED_FOUND || state === QuestState.TREE_PLANTED || state === QuestState.TREE_GROWN || state === QuestState.PORTAL_OPEN || state === QuestState.COMPLETE,
      mushroomsHappy: state === QuestState.MUSHROOMS_HAPPY || state === QuestState.CRYSTAL_FOUND || state === QuestState.CAPSULE_OPENED || state === QuestState.SEED_FOUND || state === QuestState.TREE_PLANTED || state === QuestState.TREE_GROWN || state === QuestState.PORTAL_OPEN || state === QuestState.COMPLETE,
      hasDew: this.inventory.has('dew'), hasCrystal: this.inventory.has('crystal'), hasSeed: this.inventory.has('seed'),
      portalOpen: state === QuestState.PORTAL_OPEN || state === QuestState.COMPLETE
    };
  }
  _setupInput() {
    this.input.onTap((nx, ny) => {
      if (this.quest.state === QuestState.COMPLETE) return;
      const hit = this.hitbox.hitTest(nx, ny);
      if (hit) {
        const selectedItem = this.inventory.getSelected();
        if (selectedItem && hit.onUseItem) { const used = hit.onUseItem(selectedItem); if (used) { this.inventory.select(null); return; } }
        if (hit.onInteract) hit.onInteract();
      } else { this.inventory.select(null); this.hero.walkTo(nx, ny); }
    });
    this.input.onMove((nx, ny) => { this.hitbox.setHighlight(nx, ny); const hit = this.hitbox.hitTest(nx, ny); this.canvas.style.cursor = hit ? 'pointer' : 'default'; });
  }
  start() { this.running = true; this.lastTime = performance.now(); this._updateGameState(this.quest.state); requestAnimationFrame((t) => this._loop(t)); }
  _loop(time) {
    if (!this.running) return;
    const dt = Math.min(time - this.lastTime, 50); this.lastTime = time;
    this.hero.update(dt, time); this.particles.update(); this._updateGameState(this.quest.state);
    if (this.quest.state === QuestState.COMPLETE) this.hud.showCompletion();
    this.renderer.render(null, this.hero, this.objects, this.gameState, time);
    this.particles.draw(this.renderer.ctx, this.renderer);
    requestAnimationFrame((t) => this._loop(t));
  }
  restart() {
    this.quest.reset(); this.inventory.reset(); this.hero.reset(); this.particles.particles = []; this.hitbox.objects = [];
    this.hud.hideCompletion(); this.hud.hideDialogue(); this._updateGameState(this.quest.state); this._createObjects();
  }
  destroy() { this.running = false; this.input.destroy(); }
}

(function init() {
  const canvas = document.getElementById('game-canvas');
  const loadingScreen = document.getElementById('loading-screen');
  const loadingFill = document.getElementById('loading-fill');
  let tg = null;
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp; tg.ready(); tg.expand(); tg.enableClosingConfirmation();
      tg.setHeaderColor('#0a0a1a'); tg.setBackgroundColor('#0a0a1a');
    }
  } catch (e) { console.warn('Telegram WebApp API not available:', e); }
  let progress = 0;
  const loadSteps = [{ p: 15, t: 200 }, { p: 35, t: 300 }, { p: 55, t: 250 }, { p: 75, t: 300 }, { p: 90, t: 200 }, { p: 100, t: 300 }];
  let stepIdx = 0;
  function advanceLoad() {
    if (stepIdx >= loadSteps.length) { setTimeout(() => { loadingScreen.classList.add('hidden'); startGame(); }, 400); return; }
    const step = loadSteps[stepIdx]; progress = step.p; loadingFill.style.width = progress + '%'; stepIdx++; setTimeout(advanceLoad, step.t);
  }
  setTimeout(advanceLoad, 300);
  function startGame() {
    try {
      const game = new Game(canvas); window.__game = game; game.start();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { game.running = false; } else { game.running = true; game.lastTime = performance.now(); requestAnimationFrame((t) => game._loop(t)); }
      });
      document.body.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
    } catch (err) {
      console.error('Game initialization failed:', err); loadingScreen.classList.remove('hidden');
      loadingScreen.innerHTML = '<div style="color:#aabbee;font-family:sans-serif;text-align:center;padding:40px;"><div style="font-size:18px;margin-bottom:12px;">⚠️ Ошибка запуска</div><div style="font-size:13px;opacity:0.7;">' + err.message + '</div></div>';
    }
  }
})();
</script>
