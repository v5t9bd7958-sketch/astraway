<script>
// ============================================================
// ЛЕО — ПРИКЛЮЧЕНИЕ НА ДЕРЕВЕ
// Telegram Mini App | PixiJS 8 | WebGL
// Полностью переписано под PixiJS 8 API
// ============================================================

const CONFIG = {
    bgImage: 'https://cdn.jsdelivr.net/gh/v5t9bd7958-sketch/astraway@main/background.jpg',
    heroImage: 'https://cdn.jsdelivr.net/gh/v5t9bd7958-sketch/astraway@main/character.jpg',
    walkSpeed: 2.5,
    acceleration: 0.08,
    interactionDist: 60,
    totalItems: 7
};

// ============================================================
// AUDIO ENGINE
// ============================================================

class AudioEngine {
    constructor() {
        this.ctx = null;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
            this.startBGM();
        } catch(e) {
            console.warn('Web Audio API не поддерживается');
        }
    }

    resumeIfSuspended() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    startBGM() {
        if (!this.initialized) return;
        const notes = [196.00, 220.00, 261.63, 293.66, 329.63, 392.00];
        const playNote = (freq, time, duration, vol) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(vol, time + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + duration);
        };
        const schedule = () => {
            if (!this.initialized) return;
            const now = this.ctx.currentTime;
            for (let i = 0; i < 6; i++) {
                const note = notes[Math.floor(Math.random() * notes.length)];
                const time = now + i * 2 + Math.random() * 0.5;
                playNote(note, time, 3 + Math.random() * 2, 0.08);
            }
            setTimeout(schedule, 16000);
        };
        schedule();
    }

    playFootstep() {
        if (!this.initialized) return;
        this.resumeIfSuspended();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80 + Math.random() * 40, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
    }

    playCoinSound() {
        if (!this.initialized) return;
        this.resumeIfSuspended();
        const now = this.ctx.currentTime;
        [1200, 1800].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, now + i * 0.05);
            gain.gain.linearRampToValueAtTime(0.15, now + i * 0.05 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.5);
        });
    }

    playSuccessSound() {
        if (!this.initialized) return;
        this.resumeIfSuspended();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, now + i * 0.12);
            gain.gain.linearRampToValueAtTime(0.12, now + i * 0.12 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.6);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.12);
            osc.stop(now + i * 0.12 + 0.7);
        });
    }
}

const audio = new AudioEngine();

// ============================================================
// GAME STATE
// ============================================================

const GameState = {
    IDLE: 'idle',
    WALKING: 'walking',
    INTERACTING: 'interacting'
};

// ============================================================
// NAVIGATION GRAPH
// ============================================================

class NavigationGraph {
    constructor() {
        this.nodes = [
            { id: 'start', x: 0.50, y: 0.88, label: 'start' },
            { id: 'branch_left_1', x: 0.35, y: 0.78, label: 'path' },
            { id: 'branch_left_2', x: 0.22, y: 0.68, label: 'path' },
            { id: 'branch_left_3', x: 0.15, y: 0.55, label: 'path' },
            { id: 'branch_right_1', x: 0.65, y: 0.75, label: 'path' },
            { id: 'branch_right_2', x: 0.78, y: 0.65, label: 'path' },
            { id: 'branch_right_3', x: 0.85, y: 0.50, label: 'path' },
            { id: 'center_1', x: 0.50, y: 0.70, label: 'path' },
            { id: 'center_2', x: 0.50, y: 0.58, label: 'path' },
            { id: 'center_3', x: 0.50, y: 0.45, label: 'path' },
            { id: 'top_left', x: 0.30, y: 0.40, label: 'path' },
            { id: 'top_right', x: 0.70, y: 0.38, label: 'path' },
            { id: 'top_center', x: 0.50, y: 0.32, label: 'path' },
            { id: 'item_1', x: 0.20, y: 0.52, label: 'item', itemId: 0 },
            { id: 'item_2', x: 0.35, y: 0.42, label: 'item', itemId: 1 },
            { id: 'item_3', x: 0.50, y: 0.35, label: 'item', itemId: 2 },
            { id: 'item_4', x: 0.65, y: 0.40, label: 'item', itemId: 3 },
            { id: 'item_5', x: 0.80, y: 0.48, label: 'item', itemId: 4 },
            { id: 'item_6', x: 0.72, y: 0.62, label: 'item', itemId: 5 },
            { id: 'item_7', x: 0.45, y: 0.65, label: 'item', itemId: 6 }
        ];
        
        this.edges = [
            ['start', 'branch_left_1'], ['start', 'branch_right_1'], ['start', 'center_1'],
            ['branch_left_1', 'branch_left_2'], ['branch_left_2', 'branch_left_3'],
            ['branch_left_3', 'item_1'], ['branch_left_3', 'top_left'],
            ['branch_right_1', 'branch_right_2'], ['branch_right_2', 'branch_right_3'],
            ['branch_right_3', 'item_5'], ['branch_right_3', 'top_right'],
            ['center_1', 'center_2'], ['center_2', 'center_3'],
            ['center_3', 'item_3'], ['center_3', 'top_center'],
            ['center_2', 'branch_left_2'], ['center_2', 'branch_right_2'],
            ['top_left', 'item_2'], ['top_right', 'item_4'],
            ['top_center', 'item_3'], ['branch_right_2', 'item_6'],
            ['center_1', 'item_7']
        ];
    }

    getNode(id) { return this.nodes.find(n => n.id === id); }
    
    getNeighbors(nodeId) {
        return this.edges
            .filter(e => e[0] === nodeId || e[1] === nodeId)
            .map(e => e[0] === nodeId ? e[1] : e[0]);
    }

    findPath(startId, targetId) {
        const start = this.getNode(startId);
        const target = this.getNode(targetId);
        if (!start || !target) return null;

        const openSet = [{ id: startId, g: 0, f: this.heuristic(start, target), parent: null }];
        const closedSet = new Set();
        const cameFrom = {};

        while (openSet.length > 0) {
            openSet.sort((a, b) => a.f - b.f);
            const current = openSet.shift();
            
            if (current.id === targetId) {
                const path = [];
                let curr = current.id;
                while (curr) {
                    path.unshift(this.getNode(curr));
                    curr = cameFrom[curr];
                }
                return path;
            }

            closedSet.add(current.id);
            const neighbors = this.getNeighbors(current.id);
            
            for (const neighborId of neighbors) {
                if (closedSet.has(neighborId)) continue;
                const neighbor = this.getNode(neighborId);
                const g = current.g + this.dist(this.getNode(current.id), neighbor);
                const existing = openSet.find(n => n.id === neighborId);
                
                if (!existing || g < existing.g) {
                    cameFrom[neighborId] = current.id;
                    const f = g + this.heuristic(neighbor, target);
                    if (!existing) {
                        openSet.push({ id: neighborId, g, f, parent: current.id });
                    } else {
                        existing.g = g; existing.f = f;
                    }
                }
            }
        }
        return null;
    }

    heuristic(a, b) {
        return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
    }

    dist(a, b) {
        return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
    }

    getNearestNode(x, y) {
        let nearest = null; let minDist = Infinity;
        for (const node of this.nodes) {
            const d = Math.sqrt((node.x - x) ** 2 + (node.y - y) ** 2);
            if (d < minDist) { minDist = d; nearest = node; }
        }
        return nearest;
    }
}

// ============================================================
// SIMPLE HERO
// ============================================================

class SimpleHero {
    constructor(texture) {
        this.container = new PIXI.Container();
        this.sprite = new PIXI.Sprite(texture);
        this.sprite.anchor.set(0.5, 0.85);
        this.container.addChild(this.sprite);
        
        this.walkCycle = 0;
        this.direction = 1;
        this.blinkTimer = 0;
        this.nextBlink = 2 + Math.random() * 4;
        this.emotion = 'idle';
        this.emotionTimer = 0;
        this.isMoving = false;
    }

    update(delta, state, direction) {
        this.isMoving = state === GameState.WALKING;
        if (this.isMoving) {
            this.walkCycle += delta * 0.15;
            const bounce = Math.abs(Math.sin(this.walkCycle * 2)) * 3;
            this.sprite.y = -bounce;
            this.sprite.rotation = Math.sin(this.walkCycle) * 0.03;
            if (direction === 'left') this.sprite.scale.x = -1;
            else if (direction === 'right') this.sprite.scale.x = 1;
        } else {
            this.sprite.y *= 0.9;
            this.sprite.rotation *= 0.9;
        }
        
        this.blinkTimer += delta / 60;
        if (this.blinkTimer > this.nextBlink) {
            this.blinkTimer = 0;
            this.nextBlink = 2 + Math.random() * 5;
            this.animateBlink();
        }
        
        this.updateEmotion(delta);
    }

    animateBlink() {
        let phase = 0;
        const step = () => {
            phase += 0.2;
            if (phase < Math.PI) {
                this.sprite.scale.y = 1 - Math.sin(phase) * 0.15;
                requestAnimationFrame(step);
            } else {
                this.sprite.scale.y = 1;
            }
        };
        step();
    }

    updateEmotion(delta) {
        this.emotionTimer += delta / 60;
        switch(this.emotion) {
            case 'happy':
                this.sprite.rotation = Math.sin(this.emotionTimer * 8) * 0.05;
                break;
            case 'curious':
                this.sprite.rotation = 0.1 * Math.sin(this.emotionTimer * 3);
                break;
            case 'surprised':
                this.sprite.rotation = -0.2;
                break;
            case 'concentrated':
                this.sprite.rotation = 0.05;
                break;
            default:
                break;
        }
    }

    setScale(scale) {
        this.container.scale.set(scale);
    }
    
    setEmotion(emotion) {
        this.emotion = emotion;
        this.emotionTimer = 0;
    }
}

// ============================================================
// INTERACTIVE ITEMS (PixiJS 8 Graphics API)
// ============================================================

class InteractiveItem {
    constructor(id, x, y, navNodeId) {
        this.id = id;
        this.navNodeId = navNodeId;
        this.collected = false;
        
        this.container = new PIXI.Container();
        this.container.x = x;
        this.container.y = y;
        
        this.glow = new PIXI.Graphics();
        this.drawGlow();
        
        this.core = new PIXI.Graphics();
        this.drawCore();
        
        this.container.addChild(this.glow, this.core);
        
        this.floatPhase = Math.random() * Math.PI * 2;
        this.pulsePhase = Math.random() * Math.PI * 2;
    }

    drawGlow() {
        this.glow.clear();
        const colors = [0xffd700, 0xff6b35, 0x4fc3f7, 0x81c784, 0xba68c8, 0xff8a65, 0x4dd0e1];
        const color = colors[this.id % colors.length];
        
        for (let i = 3; i >= 1; i--) {
            this.glow.circle(0, 0, 25 * i);
            this.glow.fill({ color: color, alpha: 0.08 / i });
        }
    }

    drawCore() {
        this.core.clear();
        const colors = [0xffd700, 0xff6b35, 0x4fc3f7, 0x81c784, 0xba68c8, 0xff8a65, 0x4dd0e1];
        const color = colors[this.id % colors.length];
        
        this.core.circle(0, 0, 12);
        this.core.fill({ color: color, alpha: 0.9 });
        
        this.core.circle(-4, -4, 4);
        this.core.fill({ color: 0xffffff, alpha: 0.6 });
    }

    update(delta, time) {
        if (this.collected) {
            this.container.alpha *= 0.95;
            this.container.scale.x *= 0.98;
            this.container.scale.y *= 0.98;
            return;
        }
        
        this.floatPhase += delta * 0.02;
        this.container.y += Math.sin(this.floatPhase) * 0.3;
        
        this.pulsePhase += delta * 0.03;
        const pulse = 0.8 + Math.sin(this.pulsePhase) * 0.2;
        this.glow.scale.set(pulse);
        this.glow.alpha = 0.5 + Math.sin(this.pulsePhase) * 0.2;
    }

    playCollectAnimation() {
        this.collected = true;
        const flash = new PIXI.Graphics();
        flash.circle(0, 0, 50);
        flash.fill({ color: 0xffffff, alpha: 0.8 });
        this.container.addChild(flash);
        
        let phase = 0;
        const anim = () => {
            phase += 0.1;
            flash.alpha = 1 - phase;
            flash.scale.set(1 + phase * 2);
            if (phase < 1) requestAnimationFrame(anim);
            else flash.destroy();
        };
        anim();
    }
}

// ============================================================
// ENVIRONMENT EFFECTS (PixiJS 8 Graphics API)
// ============================================================

class EnvironmentEffects {
    constructor(container, width, height) {
        this.container = container;
        this.width = width;
        this.height = height;
        
        this.leaves = [];
        this.createLeaves();
        
        this.fireflies = [];
        this.createFireflies();
    }

    createLeaves() {
        for (let i = 0; i < 10; i++) {
            const leaf = new PIXI.Graphics();
            leaf.ellipse(0, 0, 8, 4);
            leaf.fill({ color: 0x43a047, alpha: 0.3 });
            leaf.x = Math.random() * this.width;
            leaf.y = Math.random() * this.height;
            leaf.rotation = Math.random() * Math.PI * 2;
            this.container.addChild(leaf);
            this.leaves.push({
                sprite: leaf,
                baseX: leaf.x,
                baseY: leaf.y,
                swaySpeed: 0.5 + Math.random(),
                swayAmount: 10 + Math.random() * 20,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    createFireflies() {
        for (let i = 0; i < 15; i++) {
            const ff = new PIXI.Graphics();
            ff.circle(0, 0, 1.5);
            ff.fill({ color: 0xffeb3b, alpha: 0.5 });
            ff.x = Math.random() * this.width;
            ff.y = Math.random() * this.height;
            this.container.addChild(ff);
            this.fireflies.push({
                sprite: ff,
                speedX: (Math.random() - 0.5) * 0.3,
                speedY: (Math.random() - 0.5) * 0.2,
                phase: Math.random() * Math.PI * 2,
                blinkSpeed: 1 + Math.random() * 2
            });
        }
    }

    update(delta) {
        this.leaves.forEach(leaf => {
            leaf.phase += delta * 0.01 * leaf.swaySpeed;
            leaf.sprite.x = leaf.baseX + Math.sin(leaf.phase) * leaf.swayAmount;
            leaf.sprite.rotation += Math.sin(leaf.phase * 0.5) * 0.002 * delta;
        });
        
        this.fireflies.forEach(ff => {
            ff.phase += delta * 0.02;
            ff.sprite.x += ff.speedX * delta * 0.1;
            ff.sprite.y += ff.speedY * delta * 0.1;
            if (ff.sprite.x < 0 || ff.sprite.x > this.width) ff.speedX *= -1;
            if (ff.sprite.y < 0 || ff.sprite.y > this.height) ff.speedY *= -1;
            ff.sprite.alpha = 0.3 + Math.sin(ff.phase * ff.blinkSpeed) * 0.3;
        });
    }
}

// ============================================================
// PARTICLE SYSTEM (PixiJS 8 Graphics API)
// ============================================================

class ParticleSystem {
    constructor(container) {
        this.container = container;
        this.particles = [];
    }

    emit(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
            const p = new PIXI.Graphics();
            p.circle(0, 0, 2 + Math.random() * 2);
            p.fill({ color: color, alpha: 0.8 });
            p.x = x;
            p.y = y;
            this.container.addChild(p);
            this.particles.push({
                sprite: p,
                vx: (Math.random() - 0.5) * 4,
                vy: -2 - Math.random() * 4,
                life: 1.0,
                decay: 0.02
            });
        }
    }

    update(delta) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life -= p.decay * delta;
            p.sprite.x += p.vx * delta * 0.1;
            p.sprite.y += p.vy * delta * 0.1;
            p.vy += 0.1 * delta * 0.1;
            p.sprite.alpha = p.life;
            p.sprite.scale.set(p.life);
            if (p.life <= 0) {
                p.sprite.destroy();
                this.particles.splice(i, 1);
            }
        }
    }
}
// ============================================================
// MAIN GAME CLASS
// ============================================================

class Game {
    constructor() {
        this.state = GameState.IDLE;
        this.heroPosRel = { x: 0.5, y: 0.88 };
        this.currentNavNode = 'start';
        this.currentPath = [];
        this.pathIndex = 0;
        this.velocity = { x: 0, y: 0 };
        this.speed = 0;
        this.targetSpeed = CONFIG.walkSpeed;
        this.foundItems = 0;
        this.items = [];
        this.nav = new NavigationGraph();
        this.navZones = [];
        this.particles = null;
        this.envEffects = null;
        this.hero = null;
        this.gameLayer = null;
        this.footstepPlayed = false;
        this.tickerCallback = null;
    }

    async init() {
        try {
            const assets = await loadAssets();
            
            this.gameLayer = new PIXI.Container();
            app.stage.addChild(this.gameLayer);
            
            this.setupBackground(assets.bg);
            this.envEffects = new EnvironmentEffects(this.gameLayer, app.screen.width, app.screen.height);
            this.particles = new ParticleSystem(this.gameLayer);
            this.setupNavigationVisuals();
            this.setupItems();
            this.setupHero(assets.hero);
            this.setupInteraction();
            this.updateQuestCounter();
            
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1000);
            
            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-screen').classList.remove('active');
                this.state = GameState.IDLE;
            });
            
            document.getElementById('restart-btn').addEventListener('click', () => {
                this.restart();
            });
            
            // PixiJS 8: ticker callback получает Ticker объект
            this.tickerCallback = (ticker) => this.update(ticker.deltaTime);
            app.ticker.add(this.tickerCallback);
            
            window.addEventListener('resize', this.onResize.bind(this));
            
        } catch (error) {
            console.error('Ошибка инициализации:', error);
            document.getElementById('loading-text').textContent = 'Ошибка загрузки. Проверьте интернет.';
        }
    }

    setupBackground(bgTexture) {
        this.bgSprite = new PIXI.Sprite(bgTexture);
        this.bgSprite.anchor.set(0.5);
        this.fitBackground();
        this.gameLayer.addChild(this.bgSprite);
    }

    fitBackground() {
        const screenW = app.screen.width;
        const screenH = app.screen.height;
        const bgW = this.bgSprite.texture.width;
        const bgH = this.bgSprite.texture.height;
        const scale = Math.max(screenW / bgW, screenH / bgH);
        this.bgSprite.scale.set(scale);
        this.bgSprite.x = screenW / 2;
        this.bgSprite.y = screenH / 2;
    }

    setupNavigationVisuals() {
        this.nav.nodes.forEach(node => {
            if (node.label === 'path' || node.label === 'item') {
                const zone = new PIXI.Graphics();
                zone.circle(0, 0, 30);
                zone.fill({ color: 0x000000, alpha: 0.001 });
                zone.x = node.x * app.screen.width;
                zone.y = node.y * app.screen.height;
                zone.eventMode = 'static';
                zone.cursor = 'pointer';
                // PixiJS 8: 'pointertap' удалён, используем 'pointerdown'
                zone.on('pointerdown', () => {
                    if (this.state !== GameState.INTERACTING) {
                        this.moveToNode(node.id);
                    }
                });
                this.navZones.push({ zone, node });
                this.gameLayer.addChild(zone);
            }
        });
    }

    setupItems() {
        const itemNodes = this.nav.nodes.filter(n => n.label === 'item');
        itemNodes.forEach((node, idx) => {
            const x = node.x * app.screen.width;
            const y = node.y * app.screen.height;
            const item = new InteractiveItem(idx, x, y, node.id);
            this.items.push(item);
            this.gameLayer.addChild(item.container);
        });
    }

    setupHero(heroTexture) {
        this.hero = new SimpleHero(heroTexture);
        this.heroPosRel = { x: 0.5, y: 0.88 };
        this.hero.container.x = this.heroPosRel.x * app.screen.width;
        this.hero.container.y = this.heroPosRel.y * app.screen.height;
        this.hero.setScale(0.2);
        this.gameLayer.addChild(this.hero.container);
    }

    setupInteraction() {
        const bg = new PIXI.Graphics();
        bg.rect(0, 0, app.screen.width, app.screen.height);
        bg.fill({ color: 0x000000, alpha: 0.001 });
        bg.eventMode = 'static';
        this.gameLayer.addChildAt(bg, 1);
        
        // PixiJS 8: 'pointertap' → 'pointerdown', e.data.getLocalPosition → e.getLocalPosition
        bg.on('pointerdown', (e) => {
            if (this.state === GameState.INTERACTING) return;
            const localPos = e.getLocalPosition(this.gameLayer);
            const relX = localPos.x / app.screen.width;
            const relY = localPos.y / app.screen.height;
            const nearest = this.nav.getNearestNode(relX, relY);
            if (nearest) {
                this.moveToNode(nearest.id);
            }
        });
        
        window.addEventListener('pointerdown', () => {
            if (!audio.initialized) audio.init();
        }, { once: true });
    }

    moveToNode(targetNodeId) {
        const path = this.nav.findPath(this.currentNavNode, targetNodeId);
        if (!path || path.length < 2) return;
        
        this.currentPath = path;
        this.pathIndex = 1;
        this.state = GameState.WALKING;
        this.targetSpeed = CONFIG.walkSpeed;
        
        const nextNode = path[1];
        const currentNode = path[0];
        const dx = nextNode.x - currentNode.x;
        if (dx > 0.01) this.hero.direction = 1;
        else if (dx < -0.01) this.hero.direction = -1;
    }

    update(delta) {
        if (this.envEffects) this.envEffects.update(delta);
        if (this.particles) this.particles.update(delta);
        this.items.forEach(item => item.update(delta, Date.now()));
        this.updateHero(delta);
    }

    updateHero(delta) {
        if (!this.hero) return;
        
        if (this.state === GameState.WALKING && this.currentPath && this.pathIndex < this.currentPath.length) {
            const target = this.currentPath[this.pathIndex];
            const tx = target.x * app.screen.width;
            const ty = target.y * app.screen.height;
            const currentX = this.heroPosRel.x * app.screen.width;
            const currentY = this.heroPosRel.y * app.screen.height;
            
            const dx = tx - currentX;
            const dy = ty - currentY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 5) {
                this.currentNavNode = target.id;
                this.pathIndex++;
                if (this.pathIndex >= this.currentPath.length) {
                    this.arriveAtTarget(target);
                    return;
                } else {
                    const next = this.currentPath[this.pathIndex];
                    const dx2 = next.x - target.x;
                    if (dx2 > 0.01) this.hero.direction = 1;
                    else if (dx2 < -0.01) this.hero.direction = -1;
                }
            } else {
                const dirX = dx / dist;
                const dirY = dy / dist;
                this.speed += (this.targetSpeed - this.speed) * CONFIG.acceleration;
                
                const slowDownDist = 80;
                if (dist < slowDownDist) this.speed *= (dist / slowDownDist);
                
                this.velocity.x = dirX * this.speed;
                this.velocity.y = dirY * this.speed;
                
                this.heroPosRel.x += this.velocity.x * delta / app.screen.width;
                this.heroPosRel.y += this.velocity.y * delta / app.screen.height;
                
                if (Math.sin(this.hero.walkCycle) > 0.8 && !this.footstepPlayed) {
                    audio.playFootstep();
                    this.footstepPlayed = true;
                } else if (Math.sin(this.hero.walkCycle) < -0.8) {
                    this.footstepPlayed = false;
                }
            }
        } else if (this.state === GameState.WALKING) {
            this.state = GameState.IDLE;
            this.speed = 0;
            this.velocity.x = 0;
            this.velocity.y = 0;
        }
        
        this.hero.container.x = this.heroPosRel.x * app.screen.width;
        this.hero.container.y = this.heroPosRel.y * app.screen.height;
        
        const depthY = this.heroPosRel.y;
        const depthScale = 0.18 + (1 - depthY) * 0.1;
        this.hero.setScale(depthScale);
        
        if (this.hero.direction === -1) {
            this.hero.sprite.scale.x = -Math.abs(this.hero.sprite.scale.x);
        } else {
            this.hero.sprite.scale.x = Math.abs(this.hero.sprite.scale.x);
        }
        
        const dirStr = this.hero.direction === -1 ? 'left' : 'right';
        this.hero.update(delta, this.state, dirStr);
    }

    arriveAtTarget(node) {
        this.state = GameState.IDLE;
        this.speed = 0;
        this.velocity.x = 0;
        this.velocity.y = 0;
        
        if (node.label === 'item') {
            const item = this.items.find(i => i.navNodeId === node.id);
            if (item && !item.collected) {
                const dx = item.container.x - this.heroPosRel.x * app.screen.width;
                const dy = item.container.y - this.heroPosRel.y * app.screen.height;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < CONFIG.interactionDist) {
                    this.interactWithItem(item);
                }
            }
        }
    }

    async interactWithItem(item) {
        this.state = GameState.INTERACTING;
        this.hero.setEmotion('concentrated');
        await this.wait(400);
        
        this.hero.setEmotion('surprised');
        await this.wait(300);
        
        item.playCollectAnimation();
        audio.playCoinSound();
        this.particles.emit(item.container.x, item.container.y, 0xffd700, 15);
        
        this.hero.setEmotion('happy');
        audio.playSuccessSound();
        
        this.foundItems++;
        this.updateQuestCounter();
        
        await this.wait(1000);
        
        this.hero.setEmotion('idle');
        this.state = GameState.IDLE;
        
        if (this.foundItems >= CONFIG.totalItems) {
            this.victory();
        }
    }

    wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    updateQuestCounter() {
        document.getElementById('found-count').textContent = this.foundItems;
    }

    victory() {
        setTimeout(() => {
            document.getElementById('victory-screen').style.display = 'flex';
        }, 500);
    }

    restart() {
        this.foundItems = 0;
        this.updateQuestCounter();
        
        // Полностью пересоздаём предметы
        this.items.forEach(item => {
            item.container.destroy();
        });
        this.items = [];
        this.setupItems();
        
        this.heroPosRel = { x: 0.5, y: 0.88 };
        this.currentNavNode = 'start';
        this.currentPath = [];
        this.pathIndex = 0;
        this.state = GameState.IDLE;
        this.speed = 0;
        this.velocity.x = 0;
        this.velocity.y = 0;
        this.hero.setEmotion('idle');
        
        document.getElementById('victory-screen').style.display = 'none';
    }

    onResize() {
        if (this.bgSprite) this.fitBackground();
        
        this.items.forEach((item, idx) => {
            const node = this.nav.nodes.find(n => n.label === 'item' && n.itemId === idx);
            if (node) {
                item.container.x = node.x * app.screen.width;
                item.container.y = node.y * app.screen.height;
            }
        });
        
        this.navZones.forEach(({ zone, node }) => {
            zone.x = node.x * app.screen.width;
            zone.y = node.y * app.screen.height;
        });
        
        const current = this.nav.getNode(this.currentNavNode);
        if (current && this.state === GameState.IDLE) {
            this.heroPosRel.x = current.x;
            this.heroPosRel.y = current.y;
            this.hero.container.x = current.x * app.screen.width;
            this.hero.container.y = current.y * app.screen.height;
        }
    }

    destroy() {
        if (this.tickerCallback) {
            app.ticker.remove(this.tickerCallback);
        }
        if (this.gameLayer) {
            this.gameLayer.destroy({ children: true });
        }
    }
}

// ============================================================
// ASSET LOADING (PixiJS 8 API)
// ============================================================

async function loadAssets() {
    // PixiJS 8: обязательно инициализировать Assets перед загрузкой
    await PIXI.Assets.init({
        manifest: {
            bundles: [
                { name: 'game-assets', assets: [
                    { alias: 'bg', src: CONFIG.bgImage },
                    { alias: 'hero', src: CONFIG.heroImage }
                ]}
            ]
        }
    });

    const loadWithTimeout = (alias, timeout = 15000) => {
        return Promise.race([
            PIXI.Assets.load(alias),
            new Promise((_, reject) => 
                setTimeout(() => reject(new Error(`Таймаут загрузки ${alias}`)), timeout)
            )
        ]);
    };

    try {
        const bgTexture = await loadWithTimeout('bg');
        const heroTexture = await loadWithTimeout('hero');
        
        if (!bgTexture || !heroTexture) {
            throw new Error('Текстуры не загружены');
        }
        
        return { bg: bgTexture, hero: heroTexture };
    } catch (err) {
        throw new Error('Ошибка загрузки изображений: ' + err.message);
    }
}

try {
    app = new PIXI.Application({
        resizeTo: window,
        background: 0x0a0f0a,  // PixiJS 8: backgroundColor → background
        antialias: true,
        resolution: isMobile ? 1 : Math.min(window.devicePixelRatio, 2),  // Мобильные = 1
        autoDensity: true,
        // Убран powerPreference — вызывает проблемы на слабых устройствах
    });
    
    // PixiJS 8: app.view → app.canvas
    document.getElementById('game-container').appendChild(app.canvas);
} catch (e) {
    console.error('PixiJS init error:', e);
    document.getElementById('loading-text').textContent = 'Ошибка инициализации WebGL. Попробуйте обновить браузер.';
    throw e;
}
